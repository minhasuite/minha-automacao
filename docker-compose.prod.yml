# Stack de produção do minha-automacao (/opt/minha-automacao na VPS): web + API
# no mesmo processo, worker Solid Queue.
#
# Postgres COMPARTILHADO da VPS (ms-postgres) na rede externa `minhasuite-net`,
# alcançado pelo container_name; banco próprio `minha_automacao_prod` com
# usuário próprio. O Caddy faz reverse_proxy para ms-minha-automacao-web:3000.
# Fila e cache no Postgres (Solid Queue + Solid Cache), sem Redis.
#
# Padrão da suíte: na VPS (/opt/minha-automacao/.env) as variáveis têm o
# prefixo MINHA_AUTOMACAO_; dentro do container, nome curto. Web e worker
# recebem o MESMO ambiente pela âncora (worker sem chave já foi bug).

x-app-env: &app-env
  RAILS_ENV: production
  DATABASE_URL: postgresql://${MINHA_AUTOMACAO_DB_USER:-minha_automacao}:${MINHA_AUTOMACAO_DB_PASSWORD:-${POSTGRES_PASSWORD}}@ms-postgres:5432/minha_automacao_prod
  SECRET_KEY_BASE: ${MINHA_AUTOMACAO_SECRET_KEY_BASE:?set MINHA_AUTOMACAO_SECRET_KEY_BASE}
  RAILS_LOG_TO_STDOUT: "true"
  # Host das URLs de anexo e dos links dos e-mails.
  APP_HOST: ${MINHA_AUTOMACAO_APP_HOST:-minhaautomacao.minhasuite.com}
  # Login Google: client WEB (o app manda o id_token emitido para ele).
  GOOGLE_CLIENT_ID: ${MINHA_AUTOMACAO_GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${MINHA_AUTOMACAO_GOOGLE_CLIENT_SECRET:-}
  # meulog (telemetria). Vazio = desligado. A CONTA vai no caminho da URL.
  MEULOG_URL: ${MINHA_AUTOMACAO_MEULOG_URL:-}
  MEULOG_TOKEN: ${MINHA_AUTOMACAO_MEULOG_TOKEN:-}
  # IA. Provedor/modelo por tier no painel; chave vazia do provedor do tier =
  # IA daquele tier desligada (app mostra só o manual). Padrão da suíte: Anthropic.
  GEMINI_API_KEY: ${MINHA_AUTOMACAO_GEMINI_API_KEY:-}
  ANTHROPIC_API_KEY: ${MINHA_AUTOMACAO_ANTHROPIC_API_KEY:-}
  OPENAI_API_KEY: ${MINHA_AUTOMACAO_OPENAI_API_KEY:-}
  # Push nativo (FCM HTTP v1). Vazio = sem push (notificação in-app continua).
  FCM_CREDENTIALS_JSON: ${MINHA_AUTOMACAO_FCM_CREDENTIALS_JSON:-}
  FCM_PROJECT_ID: ${MINHA_AUTOMACAO_FCM_PROJECT_ID:-}
  # Web Push da PWA (bin/vapid-keys com PREFIX=MINHA_AUTOMACAO_). Vazio = sem push no navegador.
  VAPID_PUBLIC_KEY: ${MINHA_AUTOMACAO_VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${MINHA_AUTOMACAO_VAPID_PRIVATE_KEY:-}
  # Licenciamento central (licencas/docs/INTEGRACAO.md). Chave vazia = desligado.
  LICENCAS_URL: ${MINHA_AUTOMACAO_LICENCAS_URL:-https://licencas.minhasuite.com}
  LICENCAS_API_KEY: ${MINHA_AUTOMACAO_LICENCAS_API_KEY:-}
  # Assinatura pela Google Play (conta de serviço play-publisher e segredo do RTDN). Vazio = verificação desligada.
  PLAY_PACKAGE_NAME: ${MINHA_AUTOMACAO_PLAY_PACKAGE_NAME:-com.minhasuite.minhaautomacao}
  PLAY_SERVICE_ACCOUNT_JSON: ${MINHA_AUTOMACAO_PLAY_SERVICE_ACCOUNT_JSON:-}
  PLAY_RTDN_TOKEN: ${MINHA_AUTOMACAO_PLAY_RTDN_TOKEN:-}
  # Object storage (Active Storage → Cloudflare R2).
  # Vazio = cloudflare se houver chave do R2, senão disco. `local` força o
  # volume (alavanca de rollback).
  ACTIVE_STORAGE_SERVICE: ${MINHA_AUTOMACAO_ACTIVE_STORAGE_SERVICE:-}
  R2_ACCESS_KEY_ID: ${MINHA_AUTOMACAO_R2_ACCESS_KEY_ID:-}
  R2_SECRET_ACCESS_KEY: ${MINHA_AUTOMACAO_R2_SECRET_ACCESS_KEY:-}
  R2_ENDPOINT: ${MINHA_AUTOMACAO_R2_ENDPOINT:-}
  R2_BUCKET: ${MINHA_AUTOMACAO_R2_BUCKET:-minha-automacao-prod}
  # Cifra do `encrypts` (credenciais de integração). Obrigatória em produção.
  AR_ENCRYPTION_PRIMARY_KEY: ${MINHA_AUTOMACAO_AR_ENC_PRIMARY_KEY:?set MINHA_AUTOMACAO_AR_ENC_PRIMARY_KEY}
  AR_ENCRYPTION_DETERMINISTIC_KEY: ${MINHA_AUTOMACAO_AR_ENC_DETERMINISTIC_KEY:?set MINHA_AUTOMACAO_AR_ENC_DETERMINISTIC_KEY}
  AR_ENCRYPTION_KEY_DERIVATION_SALT: ${MINHA_AUTOMACAO_AR_ENC_SALT:?set MINHA_AUTOMACAO_AR_ENC_SALT}
  # E-mail (esqueci a senha). Vazio = não envia (só log); o endpoint segue 200.
  SMTP_ADDRESS: ${MINHA_AUTOMACAO_SMTP_ADDRESS:-}
  SMTP_PORT: ${MINHA_AUTOMACAO_SMTP_PORT:-587}
  SMTP_USERNAME: ${MINHA_AUTOMACAO_SMTP_USERNAME:-}
  SMTP_PASSWORD: ${MINHA_AUTOMACAO_SMTP_PASSWORD:-}
  MAIL_FROM: ${MINHA_AUTOMACAO_MAIL_FROM:-Minha Automação <nao-responda@minhasuite.com>}
  # CORS fechado por padrão (o app nativo não manda Origin).
  API_CORS_ORIGINS: ${MINHA_AUTOMACAO_API_CORS_ORIGINS:-}

services:
  minha-automacao-web:
    image: ${MINHA_AUTOMACAO_IMAGE:-ghcr.io/minhasuite/minha-automacao:latest}
    container_name: ms-minha-automacao-web
    restart: unless-stopped
    networks:
      - minhasuite-net
    volumes:
      - ms-minha-automacao-storage:/app/storage
    environment:
      <<: *app-env
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-3}
    expose:
      - "3000"
    # db:prepare: cria se faltar e migra; idempotente (padrão da suíte).
    command: >
      bash -c "bundle exec rails db:prepare &&
               exec bundle exec puma -C config/puma.rb"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/up || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  # Worker Solid Queue: jobs (push, assinatura, licenças, IA) e as tarefas
  # recorrentes de config/recurring.yml.
  minha-automacao-worker:
    image: ${MINHA_AUTOMACAO_IMAGE:-ghcr.io/minhasuite/minha-automacao:latest}
    container_name: ms-minha-automacao-worker
    restart: unless-stopped
    networks:
      - minhasuite-net
    depends_on:
      minha-automacao-web:
        condition: service_healthy
    volumes:
      - ms-minha-automacao-storage:/app/storage
    command: bundle exec ruby bin/jobs
    environment:
      <<: *app-env
      DB_POOL: ${MINHA_AUTOMACAO_WORKER_DB_POOL:-5} # 3 threads do worker (queue.yml) + 2 do Solid Queue

networks:
  minhasuite-net:
    name: minhasuite-net
    external: true

volumes:
  ms-minha-automacao-storage:
    name: ms-minha-automacao-storage
