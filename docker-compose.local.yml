# Servidor local da casa (/opt/minha-automacao no Debian): Postgres próprio,
# web, worker (fila + ouvintes Tuya e MQTT), Mosquitto, go2rtc (câmeras),
# supervisor dos aplicativos, backup diário e túnel Cloudflare.
# Subido pelo bin/deploy-local (a imagem vem do WSL; o servidor não guarda
# credencial do GitHub). Segredos em /opt/minha-automacao/.env (chmod 600),
# gerados lá na primeira vez; nada daqui é segredo.
#
# Rede bridge: o driver tuya_local fala TCP direto com o IP do aparelho, sem
# precisar de host. A descoberta por broadcast UDP (6666/6667) pediria
# network_mode: host no worker; ainda não existe (o IP vem da importação).

x-app: &app
  image: ${IMAGE:-ghcr.io/minhasuite/minha-automacao:latest}
  restart: unless-stopped
  env_file: .env
  environment: &app-env
    RAILS_ENV: production
    DATABASE_URL: postgresql://minha_automacao:${DB_PASSWORD:?set DB_PASSWORD}@db:5432/minha_automacao
    RAILS_LOG_TO_STDOUT: "true"
    APP_HOST: ${APP_HOST:-192.168.68.199}
    ASSUME_SSL: "false"
    FORCE_SSL: "false"
    ACTIVE_STORAGE_SERVICE: local
    GO2RTC_URL: http://go2rtc:1984
    SUPERVISOR_URL: http://supervisor:8099
    # Pacote 1: descoberta mDNS na rede bridge (pergunta unicast por IP; ex.: 192.168.68.0/22). Vazio = só multicast.
    MDNS_SUBNET: ${MDNS_SUBNET:-}
  volumes:
    - storage:/app/storage
    - ./backups:/backups:ro # Sistema (Lote 4): data do último backup; G20: o worker cifra e manda para fora
    - ./secrets:/secrets:ro # G20: chave SSH do destino da cópia externa (docs/backup.md)

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    # Servidor de casa costuma ter HD (não SSD): cada leitura de sensor é um
    # commit, e esperar o fsync de cada um travava a fila e os comandos.
    # synchronous_commit=off arrisca só os últimos ~0,6 s numa queda de
    # energia (o banco não corrompe); checkpoints mais espaçados escrevem menos.
    command:
      - postgres
      - -c
      - synchronous_commit=off
      - -c
      - wal_writer_delay=200ms
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-256MB}
      - -c
      - checkpoint_timeout=15min
      - -c
      - max_wal_size=2GB
      - -c
      - effective_io_concurrency=${PG_IO_CONCURRENCY:-1}
    environment:
      POSTGRES_USER: minha_automacao
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      POSTGRES_DB: minha_automacao
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minha_automacao"]
      interval: 5s
      retries: 10

  web:
    <<: *app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:3000"
    environment:
      <<: *app-env
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-3}
    command: bash -c "bundle exec rails db:prepare && exec bundle exec puma -C config/puma.rb"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/up || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  # Fila (comandos dos aparelhos, tarefas recorrentes) e o ouvinte Tuya.
  worker:
    <<: *app
    depends_on:
      web:
        condition: service_healthy
    command: bundle exec ruby bin/jobs
    # Saúde = batimento do Worker do Solid Queue + fila andando (bin/worker-health).
    # 3 falhas seguidas: o script encerra o supervisor e o restart sobe de novo.
    healthcheck:
      test: ["CMD", "bin/worker-health"]
      interval: 60s
      timeout: 20s
      start_period: 180s
      retries: 3
    environment:
      <<: *app-env
      DB_POOL: "${DB_POOL:-24}" # threads do worker (JOB_THREADS) + Solid Queue + ouvintes e leitura periódica
      JOB_THREADS: "${JOB_THREADS:-6}"
      MQTT_URL: mqtt://automacao:${MQTT_PASSWORD:?set MQTT_PASSWORD}@mosquitto:1883

  # Broker MQTT (driver mqtt, zigbee2mqtt). Com senha; a porta 1883 fica na
  # rede local para sensores (o túnel só leva a web).
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    restart: unless-stopped
    environment:
      MQTT_PASSWORD: ${MQTT_PASSWORD:?set MQTT_PASSWORD}
    ports:
      - "1883:1883"
    networks: [default, apps] # apps instalados (Zigbee2MQTT, Node-RED) falam MQTT
    volumes:
      - mosquitto:/mosquitto/data
    command:
      - sh
      - -c
      - |
        printf 'listener 1883\nallow_anonymous false\npassword_file /mosquitto/passwd\npersistence true\npersistence_location /mosquitto/data/\n' > /mosquitto/m.conf
        mosquitto_passwd -b -c /mosquitto/passwd automacao "$$MQTT_PASSWORD"
        chown mosquitto:mosquitto /mosquitto/passwd /mosquitto/data && chmod 600 /mosquitto/passwd
        exec mosquitto -c /mosquitto/m.conf

  # Câmeras. Sem config própria: o worker põe os streams pela API
  # (Go2rtcSyncJob). API e RTSP só na rede do compose (o navegador passa pelo
  # Rails); 8555 é a mídia WebRTC, anunciada no IP do servidor.
  go2rtc:
    image: alexxit/go2rtc:1.9.9
    restart: unless-stopped
    command:
      - go2rtc
      - -config
      - "{api: {listen: ':1984'}, rtsp: {listen: ''}, srtp: {listen: ''}, webrtc: {listen: ':8555', candidates: ['${APP_HOST:-192.168.68.199}:8555']}}"
    ports:
      - "8555:8555/tcp"
      - "8555:8555/udp"

  # Supervisor dos aplicativos (F8g, supervisor/server.rb): o ÚNICO serviço
  # com o socket do Docker. API só na rede interna (sem porta no host), com
  # SUPERVISOR_TOKEN; sem env_file (não recebe os segredos do Rails, só os
  # que um manifesto pode repassar). Os apps instalados (ma-app-*) ficam fora
  # do compose: o deploy não os derruba.
  supervisor:
    image: ${IMAGE:-ghcr.io/minhasuite/minha-automacao:latest}
    restart: unless-stopped
    command: bundle exec ruby supervisor/server.rb
    environment:
      SUPERVISOR_TOKEN: ${SUPERVISOR_TOKEN:?set SUPERVISOR_TOKEN}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?set MQTT_PASSWORD}
      Z2M_FRONTEND_TOKEN: ${Z2M_FRONTEND_TOKEN:-}
      APPS_NETWORK: minha-automacao-apps
      APPS_PROJECT: minha-automacao
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8099/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # pg_dump diário com 7 dias de retenção em /opt/minha-automacao/backups.
  backup:
    image: postgres:18-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint:
      - sh
      - -c
      - |
        sleep 600 # primeiro backup depois do db:prepare
        while true; do
          f=/backups/minha_automacao-$$(date +%F).sql.gz
          pg_dump -h db -U minha_automacao minha_automacao | gzip > "$$f.tmp" && mv "$$f.tmp" "$$f" && echo "backup $$f"
          find /backups -name 'minha_automacao-*.sql.gz' -mtime +7 -delete
          sleep 86400
        done

  # Matter (Pacote 1): o python-matter-server do HA, DESLIGADO por padrão
  # (perfil `matter`: `docker compose --profile matter up -d matter-server`).
  # Rede do host, como o HA exige (IPv6, mDNS e Thread pelo border router);
  # o worker fala com ele em ws://<IP do servidor>:5580/ws (integração Matter).
  matter-server:
    image: ghcr.io/home-assistant-libs/python-matter-server:stable
    restart: unless-stopped
    profiles: ["matter"]
    network_mode: host
    security_opt:
      - apparmor=unconfined # Bluetooth/D-Bus do comissionamento, como no HA
    volumes:
      - matter-data:/data

  # ondaC1 (C3): Thread, DESLIGADO por padrão (perfil `thread`:
  # `docker compose --profile thread up -d otbr`). OpenThread Border Router
  # com um rádio RCP na USB (ex.: SkyConnect/ZBT-1, nRF52840 com firmware
  # RCP); API REST na 8081 para a integração "Thread". Rede do host (IPv6 e
  # mDNS do Thread). Fixar a tag da imagem quando subir de verdade.
  otbr:
    image: openthread/otbr:latest
    restart: unless-stopped
    profiles: ["thread"]
    network_mode: host
    privileged: true
    environment:
      OT_RCP_DEVICE: spinel+hdlc+uart://${OTBR_DEVICE:-/dev/ttyUSB0}?uart-baudrate=460800
      OT_INFRA_IF: ${OTBR_INFRA_IF:-eth0}
      OT_THREAD_IF: wpan0
      OT_LOG_LEVEL: "6"
      OT_REST_LISTEN_ADDR: 0.0.0.0
      OT_REST_LISTEN_PORT: "8081"
    devices:
      - ${OTBR_DEVICE:-/dev/ttyUSB0}:${OTBR_DEVICE:-/dev/ttyUSB0}
    volumes:
      - otbr-data:/var/lib/thread

  # ondaC1 (C5): Ponte HomeKit (expor), DESLIGADA por padrão (perfil `homekit`:
  # `docker compose --profile homekit up -d --build homekit-bridge`).
  # hap-nodejs (pasta homekit-bridge/): publica os pontos escolhidos na aba
  # "HomeKit" do local para o app Casa da Apple. Rede do host (mDNS do HAP,
  # porta 51826); fala com o web por HTTP com a chave gerada na aba
  # (HOMEKIT_BRIDGE_KEY no .env). O pareamento fica no volume.
  homekit-bridge:
    build: ./homekit-bridge
    image: minha-automacao-homekit-bridge:local
    restart: unless-stopped
    profiles: ["homekit"]
    network_mode: host
    environment:
      MA_URL: http://127.0.0.1:${WEB_PORT:-80}
      MA_API_KEY: ${HOMEKIT_BRIDGE_KEY:-}
    volumes:
      - homekit-bridge-data:/data

  # resto2 (grupo 9 #47/#55): gravador de firmware do SkyConnect/ZBT-1/ZBT-2
  # (pasta flasher/, universal-silabs-flasher), DESLIGADO por padrão (perfil
  # `flasher`). Não fica rodando: `docker compose --profile flasher build flasher`
  # só cria a imagem; o supervisor sobe um container de uma vez com a porta
  # serial quando a pessoa clica Instalar no firmware do rádio.
  flasher:
    build: ./flasher
    image: minha-automacao-flasher:local
    profiles: ["flasher"]
    restart: "no"

  # integ: Ponte Matter (expor), DESLIGADA por padrão (perfil `matter-bridge`:
  # `docker compose --profile matter-bridge up -d --build matter-bridge`).
  # matter.js em Node (pasta matter-bridge/): publica os pontos escolhidos na
  # aba "Matter" do local para Apple Casa, Google Home e Alexa. Rede do host
  # (mDNS e IPv6 do Matter, porta 5540); fala com o web por HTTP com a chave
  # gerada na aba (MATTER_BRIDGE_KEY no .env). O pareamento fica no volume.
  matter-bridge:
    build: ./matter-bridge
    image: minha-automacao-matter-bridge:local
    restart: unless-stopped
    profiles: ["matter-bridge"]
    network_mode: host
    environment:
      MA_URL: http://127.0.0.1:${WEB_PORT:-80}
      MA_API_KEY: ${MATTER_BRIDGE_KEY:-}
    volumes:
      - matter-bridge-data:/data

  # ondaC1 (C2): Bluetooth do próprio servidor, DESLIGADO por padrão (perfil
  # `bluetooth`: `docker compose --profile bluetooth up -d ble-scanner`).
  # Ouve o adaptador hci0 pelo HCI cru (bin/ble-scan, Ruby puro, escuta
  # passiva) e manda os anúncios para a integração "Bluetooth (adaptador do
  # servidor)" com a chave gerada na tela Gerenciar (BLE_SCANNER_KEY no .env).
  ble-scanner:
    image: ${IMAGE:-ghcr.io/minhasuite/minha-automacao:latest}
    restart: unless-stopped
    profiles: ["bluetooth"]
    network_mode: host
    cap_add: [NET_ADMIN, NET_RAW]
    command: ruby bin/ble-scan
    environment:
      MA_URL: http://127.0.0.1:${WEB_PORT:-80}
      MA_API_KEY: ${BLE_SCANNER_KEY:-}
      BLE_ADAPTER: ${BLE_ADAPTER:-0}

  # resto (7.23): escuta passiva de DHCP (bin/dhcp-watch, perfil `dhcp`:
  # `docker compose --profile dhcp up -d dhcp-watch`). Ouve os pedidos de
  # endereço em broadcast (UDP 67) e manda MAC, nome e IP para a descoberta.
  # Só ouve: não responde nem dá endereço. Chave de integração "write".
  dhcp-watch:
    image: ${IMAGE:-ghcr.io/minhasuite/minha-automacao:latest}
    restart: unless-stopped
    profiles: ["dhcp"]
    network_mode: host
    cap_add: [NET_BIND_SERVICE]
    command: ruby bin/dhcp-watch
    environment:
      MA_URL: http://127.0.0.1:${WEB_PORT:-80}
      MA_API_KEY: ${DHCP_WATCH_KEY:-}

  # Descoberta pelo app: anuncia `_minhaautomacao._tcp` na rede de casa
  # (bin/mdns-announce, Ruby puro). Rede do host porque o multicast não chega
  # na bridge; só UDP 5353, sem banco e sem segredo. Parar não afeta o resto.
  mdns:
    image: ${IMAGE:-ghcr.io/minhasuite/minha-automacao:latest}
    restart: unless-stopped
    network_mode: host
    command: ruby bin/mdns-announce
    environment:
      APP_HOST: ${APP_HOST:-192.168.68.199}
      WEB_PORT: ${WEB_PORT:-80}

  # Acesso externo. Sem CF_TUNNEL_TOKEN no .env o serviço fica de fora
  # (perfil `tunnel`, ligado pelo bin/deploy-local quando o token existe).
  cloudflared:
    image: cloudflare/cloudflared:2025.10.0
    restart: unless-stopped
    profiles: ["tunnel"]
    depends_on:
      web:
        condition: service_healthy
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:-}

  # ondaB1 (B6): voz local pelo protocolo Wyoming, opcional (perfil `voz`,
  # desligado: `docker compose --profile voz up -d`). No pipeline do
  # Assistente de voz: motor Wyoming com endereço wyoming-whisper (10300),
  # wyoming-piper (10200) e wyoming-openwakeword (10400). Nada sai da casa.
  wyoming-whisper:
    image: rhasspy/wyoming-whisper:latest
    restart: unless-stopped
    profiles: ["voz"]
    command: --model small-int8 --language pt
    volumes:
      - wyoming-whisper:/data

  wyoming-piper:
    image: rhasspy/wyoming-piper:latest
    restart: unless-stopped
    profiles: ["voz"]
    command: --voice pt_BR-faber-medium
    volumes:
      - wyoming-piper:/data

  wyoming-openwakeword:
    image: rhasspy/wyoming-openwakeword:latest
    restart: unless-stopped
    profiles: ["voz"]
    command: --preload-model ok_nabu

volumes:
  pgdata:
  storage:
  mosquitto:
  matter-data:
  matter-bridge-data:
  otbr-data:
  homekit-bridge-data:
  wyoming-whisper:
  wyoming-piper:

networks:
  # Rede dos apps instalados pelo supervisor (manifesto com `network: apps`):
  # alcançam o mosquitto, não o banco nem o web.
  apps:
    name: minha-automacao-apps
