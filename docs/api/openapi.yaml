openapi: 3.1.0
info:
  title: Minha Automação API
  version: "1.0"
  description: |
    API `/api/v1` do Minha Automação (app Flutter e integrações). Contrato da suíte:
    sucesso `{data, meta?}`, erro `{error: {code, message, details?}}`, datas ISO-8601.
    Paginação Pagy: `?page=&per_page=` e `meta: {page, per_page, count, pages, next, prev}`.

    Auth: `Authorization: Bearer <access>` (30 min; renove com `POST /auth/refresh`)
    ou `X-Api-Key` (integração, só nos recursos com escopo).
    Papéis: `owner` (dono), `admin` (administrador), `member` (membro).

    Base da suíte + F1 (locais, áreas, membros, dispositivos, pontos e comando no driver virtual).
    Mais F2 (comandos e histórico), F4 (primitivas de automação e alertas), F5 (dashboards) e F6 (automações com a DSL, docs/automacoes.md).
    F7 (app Flutter, docs/app.md): tempo real pelo Action Cable em `/cable?access_token=<access>` (cabeçalho `Origin` = endereço
    do servidor), assinando `{"channel":"PointsChannel","signed_stream_name": Site.points_stream}`; chega
    `<turbo-stream action="point_changed" target="<point_id>">` e o app relê o que depende do ponto.
servers:
  - url: https://minhaautomacao.minhasuite.com/api/v1
security:
  - bearer: []
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }
    apiKey: { type: apiKey, in: header, name: X-Api-Key }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [not_found, validation_failed, unauthorized, forbidden, plan_required, parameter_missing,
                     company_not_empty, invalid_invite, already_member, invalid_credentials, invalid_token,
                     token_reuse_detected, invalid_password, google_unconfigured, verification_failed,
                     ai_unavailable, rate_limited, internal_error]
            message: { type: string }
            details: { type: object }
    Tokens:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, example: Bearer }
        access_expires_at: { type: string, format: date-time }
        refresh_expires_at: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/User" }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [owner, admin, member] }
        role_label: { type: string, example: Dono }
        company: { type: object, properties: { id: { type: string }, name: { type: string }, plan: { type: string } } }
        has_password: { type: boolean }
        google_linked: { type: boolean }
        created_at: { type: string, format: date-time }
    Company:
      type: object
      description: A empresa (tenant). Só o dono altera.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        trade_name: { type: string, nullable: true }
        document: { type: string, nullable: true, description: "Só dígitos (CPF ou CNPJ)" }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        city: { type: string, nullable: true }
        uf: { type: string, nullable: true }
        ibge_code: { type: string, nullable: true }
        plan: { type: string, enum: [free, pro, max] }
        members_count: { type: integer }
        created_at: { type: string, format: date-time }
  responses:
    Error:
      description: erro
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
paths:
  /auth/signup:
    post:
      security: []
      summary: "Cria empresa e dono {name, email, password, company_name?, device_name?}"
      responses: { "201": { description: tokens }, "422": { $ref: "#/components/responses/Error" } }
  /auth/login: { post: { security: [], summary: "E-mail e senha {email, password, device_name?}", responses: { "201": { description: tokens }, "401": { $ref: "#/components/responses/Error" } } } }
  /auth/google: { post: { security: [], summary: "id_token do Google (client web); cria a conta na primeira vez", responses: { "201": { description: tokens }, "401": { $ref: "#/components/responses/Error" }, "503": { $ref: "#/components/responses/Error" } } } }
  /auth/refresh: { post: { security: [], summary: "Rotaciona o par {refresh_token}; reuso de refresh antigo revoga a sessão", responses: { "200": { description: tokens }, "401": { $ref: "#/components/responses/Error" } } } }
  /auth/logout: { delete: { summary: Revoga a sessão atual, responses: { "204": { description: ok } } } }
  /auth/password/forgot: { post: { security: [], summary: "{email}. Sempre 200 (não revela se a conta existe)", responses: { "200": { description: ok } } } }
  /auth/password/reset: { post: { security: [], summary: "{token, password}. Token de 30 min, uso único; derruba as sessões", responses: { "200": { description: ok }, "422": { $ref: "#/components/responses/Error" } } } }
  /me:
    get: { summary: Perfil, responses: { "200": { description: User } } }
    patch: { summary: "{name?, email?, password?, current_password?}", responses: { "200": { description: User }, "422": { $ref: "#/components/responses/Error" } } }
    delete: { summary: "Exclui a conta; o último membro leva a empresa junto", responses: { "204": { description: ok } } }
  /me/export: { get: { summary: Dados da empresa em JSON (LGPD), responses: { "200": { description: ok } } } }
  /me/wipe: { post: { summary: "Zera o conteúdo da empresa (só dono)", responses: { "200": { description: "{deleted: {tabela: n}}" }, "403": { $ref: "#/components/responses/Error" } } } }
  /me/sessions: { get: { summary: Sessões ativas, responses: { "200": { description: ok } } }, delete: { summary: Encerra as outras, responses: { "200": { description: "{revoked}" } } } }
  /me/sessions/{id}: { delete: { summary: Encerra uma sessão, responses: { "204": { description: ok } } } }
  /company:
    get: { summary: A empresa, responses: { "200": { description: Company } } }
    patch: { summary: "Atualiza (só dono)", responses: { "200": { description: Company }, "403": { $ref: "#/components/responses/Error" } } }
  /company/invites: { post: { summary: "Link de convite de uso único, 7 dias {role? member|admin, site_id?, site_role?} (só o dono). A pessoa abre o link e se cadastra direto nesta instalação", responses: { "201": { description: "{url, role, site_id, site_role, expires_at}" }, "403": { $ref: "#/components/responses/Error" } } } }
  /notifications: { get: { summary: "?unread=", responses: { "200": { description: "lista paginada; meta.unread_count" } } } }
  /notifications/{id}/read: { patch: { summary: Marca lida, responses: { "200": { description: ok } } } }
  /notifications/{id}/respond: { post: { summary: "Botão do aviso {action_id} (F7). A primeira resposta vale e vira o evento notification_action. Notificação: {id, kind, title, body, data, read_at, created_at, actions[{id,title}] (vazio depois de respondida), responded_at, response_title, url, image_url (caminho relativo = neste servidor)}. Pelo push o app responde sem sessão em POST /push/resposta {token, action_id} com o token que veio no FCM", responses: { "200": { description: Notification }, "409": { $ref: "#/components/responses/Error" }, "422": { $ref: "#/components/responses/Error" } } } }
  /notifications/read: { patch: { summary: "Marca todas {ids?}", responses: { "200": { description: "{marked, unread_count}" } } } }
  /device_tokens: { post: { summary: "Token FCM {token, platform android|ios}", responses: { "201": { description: ok } } } }
  /device_tokens/{token}: { delete: { summary: Remove, responses: { "204": { description: ok } } } }
  /api_keys:
    get: { summary: "Chaves de integração ativas (só dono)", responses: { "200": { description: ok } } }
    post: { summary: "{name, scopes: [read|command|write], site_ids: [] (obrigatório), expires_at?} → chave em claro só nesta resposta (só dono). Com X-Api-Key: read = GET de sites, devices, points e history; command = POST /points/:id/commands; write = POST /points/:id/value; local fora de site_ids = 404; o resto = 403", responses: { "201": { description: ok }, "422": { $ref: "#/components/responses/Error" } } }
  /api_keys/{id}: { delete: { summary: Revoga, responses: { "204": { description: ok } } } }
  /billing: { get: { summary: "Plano da empresa {plan free|pro|max, status, provider, expires_at, auto_renewing, product_id, base_plan, trial, purchased_by_me, purchaser_name, trial_eligible, limits {ai{feature: cota}, ai_tier}, usage {ai}, catalog[]}", responses: { "200": { description: ok } } } }
  /billing/google/verify: { post: { summary: "{purchase_token} → servidor consulta a Play (subscriptionsv2) e devolve o mesmo de /billing; 422 verification_failed", responses: { "200": { description: ok }, "422": { $ref: "#/components/responses/Error" } } } }
  /ai/quota: { get: { summary: "Cota de IA por feature (ask, daily_summary) e teto diário. Grátis: available false", responses: { "200": { description: ok } } } }
  /ai/ask: { post: { summary: "{question} (administrador) → {answer}. Placeholder até o domínio chegar; 402 plan_required fora do plano, 503 ai_unavailable", responses: { "200": { description: ok }, "402": { $ref: "#/components/responses/Error" }, "503": { $ref: "#/components/responses/Error" } } } }
  # ---- Locais, áreas, dispositivos e pontos (F1, ESQUEMA-V1 §4.1–4.3) -------------------------------------------
  # Papel por local (SiteMembership): guest < operator < resident < technician < owner. Dono/administrador da
  # empresa é owner em todos. Sem papel no local = 404. Ver: qualquer papel; cadastro de áreas, dispositivos e
  # pontos: technician+; editar/excluir o local e membros: owner. Comando: normal guest+, sensitive operator+,
  # critical resident+ (403 forbidden abaixo disso).
  /sites:
    get: { summary: "Locais que a pessoa vê (paginado). Cada um traz my_role e points_stream (nome assinado do stream de pontos para o /cable, F7)", responses: { "200": { description: "Site[]" } } }
    post: { summary: "Cria {name, kind home|store|plant, timezone?, address?, latitude?, longitude?, wallpaper?} (administrador da empresa)", responses: { "201": { description: Site }, "403": { $ref: "#/components/responses/Error" }, "422": { $ref: "#/components/responses/Error" } } }
  /sites/{id}:
    get: { summary: Local, responses: { "200": { description: Site }, "404": { $ref: "#/components/responses/Error" } } }
    patch: { summary: "Edita (owner do local)", responses: { "200": { description: Site }, "403": { $ref: "#/components/responses/Error" } } }
    delete: { summary: "Exclui com áreas, dispositivos e pontos (owner do local)", responses: { "204": { description: ok } } }
  /sites/{id}/areas:
    get: { summary: "Áreas (por position, name)", responses: { "200": { description: "Area[]" } } }
    post: { summary: "Cria {name, kind room|floor|outdoor|line|cell|warehouse, parent_id?, icon?, background?, position?} (technician+)", responses: { "201": { description: Area } } }
  /areas/{id}: { get: { summary: Área, responses: { "200": { description: Area } } }, patch: { summary: "Edita (technician+)", responses: { "200": { description: Area } } }, delete: { summary: "Exclui; dispositivos ficam sem área (technician+)", responses: { "204": { description: ok } } } }
  /sites/{id}/members:
    get: { summary: "Membros do local (owner)", responses: { "200": { description: "SiteMembership[] {role, area_ids, expires_at, user{name,email}}" } } }
    post: { summary: "{user_id (da empresa), role guest|operator|resident|technician|owner, expires_at?, area_ids?} (owner)", responses: { "201": { description: SiteMembership }, "404": { $ref: "#/components/responses/Error" } } }
  /members/{id}: { patch: { summary: "{role?, expires_at?, area_ids?} (owner)", responses: { "200": { description: SiteMembership } } }, delete: { summary: "Remove (owner)", responses: { "204": { description: ok } } } }
  /sites/{id}/devices:
    get: { summary: "Dispositivos (?area_id=)", responses: { "200": { description: "Device[]" } } }
    post: { summary: "Cria {name, area_id?, driver virtual|tuya_local|tuya_cloud|xiaomi_miot|alexa|mqtt|modbus_tcp|onvif|go2rtc, manufacturer?, model?, serial?, external_id?, address{}?, firmware?, disabled?} (technician+). Na F1 só o virtual executa comando", responses: { "201": { description: Device } } }
  /devices/{id}: { get: { summary: Dispositivo, responses: { "200": { description: Device } } }, patch: { summary: "Edita (technician+)", responses: { "200": { description: Device } } }, delete: { summary: "Exclui com os pontos (technician+)", responses: { "204": { description: ok } } } }
  /devices/{id}/replace: { get: { summary: "Substituir aparelho: aparelhos possíveis e pares sugeridos (?new_device_id=; technician+)", responses: { "200": { description: ok } } }, post: { summary: "Substitui (new_device_id, pairs [{old,new,invert}] ou map, retire remove|disable|keep, preview; technician+)", responses: { "200": { description: ok }, "422": { description: replace_failed } } } }
  /devices/{id}/replace/undo: { post: { summary: "Desfaz a última substituição do aparelho (technician+)", responses: { "200": { description: ok }, "422": { description: replace_failed } } } }
  /devices/{id}/points:
    get: { summary: "Pontos do dispositivo. ?view=app (F7): cada ponto como no dashboard resolvido {value, text, on, commands, actions, can_command (papel x risco), input, mode, device}", responses: { "200": { description: "Point[]" } } }
    post: { summary: "Cria {name, capability (§4.3 sem machine/counter), key? (gerada: dispositivo.ponto, única no local), area_id?, unit?, options[]? (obrigatório em enum), min?, max?, step?, writable?, address{}?, scale?, offset?, deadband?, history?, pulse_ms?, max_on_s?, confirm?, risk normal|sensitive|critical, expose{}?, hidden?, disabled?} (technician+)", responses: { "201": { description: Point }, "422": { $ref: "#/components/responses/Error" } } }
  /sites/{id}/points:
    get: { summary: "Todos os pontos do local como o app desenha (?view=app; &commandable=1 = só os que este papel comanda). Widgets, atalhos e controles do Android (app 0.2)", responses: { "200": { description: "Point[]" } } }
  /points/{id}: { get: { summary: "Ponto com value, quality, changed_at, reported_at (?view=app: como o app desenha)", responses: { "200": { description: Point } } }, patch: { summary: "Edita (technician+)", responses: { "200": { description: Point } } }, delete: { summary: "Exclui (technician+)", responses: { "204": { description: ok } } } }
  /points/{id}/commands:
    post: { summary: "{command, value?, client_uuid?}: onoff on|off|toggle; dimmer/setpoint set(value na faixa min..max); enum select(value em options); text set; command press; gate pulse; media on|off|resume|pause|next|previous|volume_up|volume_down, volume(0..100), mute(true|false|vazio = inverte), play_media(URI, playlist ou busca); remote send|learn|forget(value = nome do botão). address.supports corta os que o aparelho não faz (veja `commands` no ?view=app). Cria o comando rastreado e responde 202 {command_id, status pending|sent|confirmed|failed|expired, source, error, point_value, sent_at, confirmed_at}; no driver virtual já vem confirmed. Mesmo client_uuid devolve o comando já criado. 422 unsupported_command|invalid_value|not_writable|point_disabled|driver_unavailable; 403 se o papel não alcança o risco", responses: { "202": { description: Command }, "403": { $ref: "#/components/responses/Error" }, "422": { $ref: "#/components/responses/Error" } } }
  /points/{id}/value:
    post: { summary: "{value} grava o valor de um ponto de dispositivo virtual (Point#report!: automações, avisos e tempo real). Chave com permissão write. 422 not_virtual", responses: { "200": { description: Point }, "422": { $ref: "#/components/responses/Error" } } }
  /points/{id}/history:
    get: { summary: "?from&to (ISO 8601; padrão: últimas 24h) &resolution auto|raw|1h|1d. auto: até 2 dias cru, até 31 dias 1h, depois 1d; booleano sempre cru. Cru: [{at, value, value_text}] (a primeira linha é o valor vigente em from). Rollup: [{starts_at, min, max, avg, sum, last, count, on_seconds}]. meta {from, to, resolution, truncated} (máx. 5000). 400 invalid_parameter", responses: { "200": { description: "Reading[] ou Rollup[]" }, "400": { $ref: "#/components/responses/Error" } } }
  /points/{id}/snapshot:
    get: { summary: "Quadro JPEG da câmera (ponto stream de aparelho go2rtc), qualquer papel no local (F7). 503 camera_unavailable", responses: { "200": { description: "image/jpeg" }, "404": { $ref: "#/components/responses/Error" }, "503": { $ref: "#/components/responses/Error" } } }
  # ---- App do celular (F7, G17; Integrations::MobileAppPlugin). O aparelho é da pessoa que registrou.
  /sites/{id}/mobile_devices:
    post: { summary: "Registra este celular no local {install_id ([A-Za-z0-9_-]{8,64}, gerado pelo app), name, model?, platform?} (qualquer papel). Idempotente por pessoa + install_id. → Device com points[]", responses: { "201": { description: Device }, "400": { $ref: "#/components/responses/Error" }, "404": { $ref: "#/components/responses/Error" } } }
  /mobile_devices/{id}/sensors:
    post: { summary: "Leituras {battery? (0..100), charging?, wifi? (SSID; vazio = fora do Wi-Fi), location? {latitude, longitude, accuracy}} → pontos Bateria, Carregando, Wi-Fi e Presença (Em casa|Fora pelo raio da integração, padrão 150 m; atributos latitude, longitude, accuracy, distance_m). Campo ausente fica como está. Só a pessoa dona", responses: { "200": { description: "Device com points[]" }, "404": { $ref: "#/components/responses/Error" } } }
  /mobile_devices/{id}: { delete: { summary: "Remove o celular e os pontos dele (só a pessoa dona)", responses: { "204": { description: ok } } } }
  /commands/{id}:
    get: { summary: "Situação do comando (mesmo formato do 202)", responses: { "200": { description: Command }, "404": { $ref: "#/components/responses/Error" } } }
  # ---- Automação (F4). Ver: qualquer papel no local; criar/editar/excluir: technician+. JSON = linha do banco sem tenant_id. 422 validation_failed com details.
  /sites/{id}/point_links:
    get: { summary: "Espelhamentos do local", responses: { "200": { description: "PointLink[]" } } }
    post: { summary: "Cria {source_point_id, target_point_id, mode mirror|invert|trigger, bidirectional? (mirror/invert entre liga/desliga), trigger_value? (trigger; padrão true), enabled?}. Recusa laço com outros espelhamentos. Anti-eco: não comanda destino já no valor nem devolve o próprio comando (15 s); valor que volta com a conexão não aciona", responses: { "201": { description: PointLink }, "422": { $ref: "#/components/responses/Error" } } }
  /point_links/{id}: { get: { summary: Espelhamento, responses: { "200": { description: PointLink } } }, patch: { summary: "Edita (technician+)", responses: { "200": { description: PointLink } } }, delete: { summary: "Exclui (technician+)", responses: { "204": { description: ok } } } }
  /sites/{id}/schedules:
    get: { summary: "Agendas do local", responses: { "200": { description: "Schedule[]" } } }
    post: { summary: "Cria {name, kind time|sunrise|sunset, time_of_day? HH:MM (time), offset_min? -720..720, days[] 0=domingo..6, point_id + command + value? OU scene_id, enabled?}. Fuso e latitude/longitude do local (sol exige as duas). Devolve next_run_at; atrasada mais de 5 min (servidor fora) é pulada", responses: { "201": { description: Schedule }, "422": { $ref: "#/components/responses/Error" } } }
  /schedules/{id}: { get: { summary: Agenda, responses: { "200": { description: Schedule } } }, patch: { summary: "Edita (technician+)", responses: { "200": { description: Schedule } } }, delete: { summary: "Exclui (technician+)", responses: { "204": { description: ok } } } }
  /sites/{id}/scenes:
    get: { summary: "Cenas do local", responses: { "200": { description: "Scene[]" } } }
    post: { summary: "Cria {name, icon?, items[{point_id, command, value?}]} (comandos de POST /points/{id}/commands)", responses: { "201": { description: Scene }, "422": { $ref: "#/components/responses/Error" } } }
  /scenes/{id}: { get: { summary: Cena, responses: { "200": { description: Scene } } }, patch: { summary: "Edita (technician+)", responses: { "200": { description: Scene } } }, delete: { summary: "Exclui (technician+)", responses: { "204": { description: ok } } } }
  /scenes/{id}/activate:
    post: { summary: "Aciona (papel conforme o ponto de maior risco; chave: command) → 202 {commands: Command[], errors: [\"Ponto: motivo\"]}; um ponto com erro não impede os outros", responses: { "202": { description: "Comandos" }, "403": { $ref: "#/components/responses/Error" } } }
  /sites/{id}/notify_rules:
    get: { summary: "Avisos do local", responses: { "200": { description: "NotifyRule[]" } } }
    post: { summary: "Cria {point_id, to_value? (vazio = toda mudança), message? ({ponto}, {valor}), channels[] in_app|push, enabled?}. Vai para dono e administradores", responses: { "201": { description: NotifyRule }, "422": { $ref: "#/components/responses/Error" } } }
  /notify_rules/{id}: { get: { summary: Aviso, responses: { "200": { description: NotifyRule } } }, patch: { summary: "Edita (technician+)", responses: { "200": { description: NotifyRule } } }, delete: { summary: "Exclui (technician+)", responses: { "204": { description: ok } } } }
  /sites/{id}/alert_rules:
    get: { summary: "Regras de alerta do local", responses: { "200": { description: "AlertRule[]" } } }
    post: { summary: "Cria {name, point_id, operator eq|ne|gt|lt, value, for_s? (tempo na condição), severity info|warning|critical, escalation[{wait_s (desde a etapa anterior), channels[] in_app|push}], repeat_s? (≥ 60, repete a última etapa), auto_resolve?, enabled?}. Abre um alerta por regra; ciente para de repetir", responses: { "201": { description: AlertRule }, "422": { $ref: "#/components/responses/Error" } } }
  /alert_rules/{id}: { get: { summary: Regra de alerta, responses: { "200": { description: AlertRule } } }, patch: { summary: "Edita (technician+); desativar resolve o alerta aberto", responses: { "200": { description: AlertRule } } }, delete: { summary: "Exclui com os alertas (technician+)", responses: { "204": { description: ok } } } }
  /alerts:
    get: { summary: "?status=open|all (padrão open) dos locais visíveis: [{id, alert_rule_id, name, severity, point_id, point_name, point_value, level (avisos já dados), opened_at, acked_by_id, acked_at, resolved_at}]", responses: { "200": { description: "Alert[]" } } }
  /alerts/{id}: { get: { summary: Alerta, responses: { "200": { description: Alert } } } }
  /alerts/{id}/ack:
    post: { summary: "Ciente (operator+): para o escalonamento; sem auto_resolve, também fecha", responses: { "200": { description: Alert }, "403": { $ref: "#/components/responses/Error" } } }
  # ---- Dashboards (F5, ESQUEMA-V1 §6). JSON da definição e do resolvido em docs/dashboards.md. Ver: qualquer papel no
  # local e na lista roles do dashboard (vazia = todos; dono sempre); criar/alterar/publicar/voltar/excluir: technician+.
  /sites/{id}/dashboards:
    get: { summary: "Dashboards do local que o papel vê: [{id, site_id, name, kind home|plant|custom, auto, site_default, version, has_draft, roles, schema_version, updated_at, default (o que abre no Início desta pessoa)}]. Local sem nenhum ganha o automático (Início + uma view por área)", responses: { "200": { description: "Dashboard[]" } } }
    post: { summary: "Cria {name, kind?, roles[]?, site_default?, definition? (sem ela, cópia do automático)} e publica a versão 1. 422 validation_failed com details.definition", responses: { "201": { description: Dashboard }, "422": { $ref: "#/components/responses/Error" } } }
  /dashboards/{id}:
    get: { summary: "Resolvido para quem pede: {id, name, version, schema_version, role, can_edit, views[] (widgets com visible, data, deps; os que o papel não vê saem), points{id: {value, text, on, quality, can_command, risk, confirm…}}}. ?draft=1 resolve o rascunho (technician+). ETag/If-None-Match → 304", responses: { "200": { description: "Dashboard resolvido" }, "304": { description: "Sem mudança" }, "404": { $ref: "#/components/responses/Error" } } }
    put: { summary: "{name?, kind?, roles[]?, site_default?, definition?, publish? (padrão true)}: definition validada vira versão nova; publish false guarda só no rascunho", responses: { "200": { description: Dashboard }, "403": { $ref: "#/components/responses/Error" }, "422": { $ref: "#/components/responses/Error" } } }
    patch: { summary: "Igual ao PUT", responses: { "200": { description: Dashboard } } }
    delete: { summary: "Exclui (technician+). Sem nenhum, o local volta a ter o automático", responses: { "204": { description: ok } } }
  /dashboards/{id}/publish: { post: { summary: "Publica o rascunho (ou o automático, que vira manual) como versão nova", responses: { "200": { description: Dashboard } } } }
  /dashboards/{id}/revert: { post: { summary: "{version}: publica de novo uma versão antiga como a próxima", responses: { "200": { description: Dashboard }, "404": { $ref: "#/components/responses/Error" } } } }
  /dashboards/{id}/versions: { get: { summary: "[{version, author, created_at, definition}] (technician+)", responses: { "200": { description: "DashboardVersion[]" } } } }
  /dashboards/{id}/definition: { get: { summary: "{definition (rascunho em edição ou a publicada), has_draft, version}; meta.catalog = [{type, label, icon, required, bind, binds, params}] dos plugins de widget (technician+). Editor do app 0.2", responses: { "200": { description: "DashboardDefinition" } } } }
  # ---- Automações (F6, ESQUEMA-V1 §5). DSL em docs/automacoes.md. Ver lista e execuções: qualquer papel no local;
  # criar/alterar/publicar/voltar/simular/excluir: technician+. Publicar ou executar com ponto sensível/crítico exige o papel do
  # risco; crítico exige confirm_critical: true (senão 422 confirmation_required).
  /sites/{id}/automations:
    get: { summary: "[{id, site_id, area_id, name, description, enabled, mode single|restart|queued|parallel, max_runs, version, has_draft, webhook, last_run_at, last_status, last_error, updated_at}]", responses: { "200": { description: "Automation[]" } } }
    post: { summary: "Cria {name, mode?, max_runs?, area_id?, description?, enabled?, definition?, publish? (padrão true), confirm_critical?}. Ponto por UUID ou key. 422 validation_failed com a lista de erros da DSL", responses: { "201": { description: "Automation (com definition e draft)" }, "422": { $ref: "#/components/responses/Error" } } }
  /automations/{id}:
    get: { summary: "Automação com definition (publicada) e draft", responses: { "200": { description: Automation } } }
    patch: { summary: "{name?, mode?, max_runs?, area_id?, description?, enabled? (só publicada), definition?, publish?, confirm_critical?}", responses: { "200": { description: Automation }, "403": { $ref: "#/components/responses/Error" }, "422": { $ref: "#/components/responses/Error" } } }
    delete: { summary: "Exclui com versões e execuções (technician+)", responses: { "204": { description: ok } } }
  /automations/{id}/publish: { post: { summary: "{confirm_critical?}: publica o rascunho como versão nova (valida a DSL)", responses: { "200": { description: Automation }, "422": { $ref: "#/components/responses/Error" } } } }
  /automations/{id}/revert: { post: { summary: "{version, confirm_critical?}: publica de novo uma versão antiga como a próxima", responses: { "200": { description: Automation }, "404": { $ref: "#/components/responses/Error" } } } }
  /automations/{id}/versions: { get: { summary: "[{version, author, created_at, definition}] (technician+)", responses: { "200": { description: "AutomationVersion[]" } } } }
  /automations/{id}/simulate: { post: { summary: "{points?: {key|id: valor}, at?, trigger?, definition?, published?, skip_conditions?}: roda a seco (nada comandado nem avisado) e devolve a execução com steps", responses: { "200": { description: AutomationRun } } } }
  /automations/{id}/run: { post: { summary: "Executar agora (versão publicada, sem as condições). {confirm_critical?}. 409 not_started se o modo descartou", responses: { "202": { description: AutomationRun }, "403": { $ref: "#/components/responses/Error" }, "409": { $ref: "#/components/responses/Error" } } } }
  /automations/{id}/runs: { get: { summary: "Execuções (paginado, ?dry_run=true|false), sem steps: [{id, automation_id, version, status queued|running|waiting|done|skipped|stopped|failed|cancelled|loop, status_label, dry_run, depth, trigger, error, started_at, finished_at, resume_at}]", responses: { "200": { description: "AutomationRun[]" } } } }
  /automations/{id}/webhook: { post: { summary: "Gera/troca o token do webhook (technician+): {url, token}, mostrado só nesta resposta", responses: { "200": { description: "{url, token}" } } } }
  /sites/{id}/scripts:
    get: { summary: "Scripts do local (F8f; chave: read)", responses: { "200": { description: "Script[] {id, name, kind: script, mode, version, fields[{name, label, type text|number|boolean|point|select, default?, required, options?}], last_run_at...}" } } }
    post: { summary: "Cria {name, mode?, max_runs?, area_id?, icon?, description?, fields?, definition? {actions}, publish?} (technician+); na sequência, ponto de campo = \"$nome\" (docs/scripts.md)", responses: { "201": { description: Script }, "422": { $ref: "#/components/responses/Error" } } }
  /scripts/{id}: { get: { summary: "Script com definition e draft (chave: read)", responses: { "200": { description: Script } } }, patch: { summary: "Edita (technician+); definition publica (salvo publish: false)", responses: { "200": { description: Script } } }, delete: { summary: "Exclui (technician+)", responses: { "204": { description: ok } } } }
  /scripts/{id}/run:
    post: { summary: "Executa a versão publicada com {fields: {nome: valor}, confirm_critical?} → 202 AutomationRun. Papel do risco dos pontos do script e dos escolhidos nos campos; chave: command e o local na chave. 409 se o modo barrar; 422 invalid_fields", responses: { "202": { description: AutomationRun }, "403": { $ref: "#/components/responses/Error" }, "409": { $ref: "#/components/responses/Error" }, "422": { $ref: "#/components/responses/Error" } } }
  /scripts/{id}/runs: { get: { summary: "Execuções do script, paginadas (chave: read)", responses: { "200": { description: "AutomationRun[]" } } } }
  /automation_runs/{id}: { get: { summary: "Execução com o trace: steps [{at, path, kind, title, result ok|false|error|simulated|waiting|timeout|skipped, detail, ms, checks [{label, result, values, children}]}]", responses: { "200": { description: AutomationRun } } } }
  /hooks/automations/{token}:
    post: { summary: "Webhook das automações (sem login; o token é a credencial). JSON até 10 KB vira trigger.data; 60/min por token. 404 se o token não existe ou a automação está desligada/sem gatilho webhook", security: [], responses: { "202": { description: "{run_id, status}" }, "404": { $ref: "#/components/responses/Error" }, "413": { $ref: "#/components/responses/Error" } } }
  # ---- Pacote 3 (plataforma): pessoas e zonas, alarme, voz, pacotes e ferramentas. Pessoa, zona e painel de alarme são helpers
  # (GET /sites/{id}/helpers?type=person|zone|alarm_panel; comando pelo POST /points/{id}/commands). docs/presenca.md, alarme.md, assistente.md, pacotes.md, ferramentas.md.
  /sites/{id}/people:
    get: { summary: "Pessoas do local (qualquer papel; chave: read): [{id, name, zone (nome da zona ou Fora), home, since, source (fonte que decidiu), user_id, quality}] e meta.zones [{id, name, home, count, radius_m}]. Nunca coordenadas", responses: { "200": { description: "Person[]" } } }
  # ---- Paridade com o HA (compat): Diário, Histórico de vários pontos e Mapa. docs/diario-historico.md, presenca.md.
  /sites/{id}/logbook:
    get: { summary: "Diário do local (qualquer papel; chave: read): ?period=24h|7d|30d|365d, from/until (data), area_id, device_id, point_id, user_id, q, sources[] (changes, commands, runs, scenes, alerts, quality; audit técnico+, logins dono), limit (até 200), before (cursor) → [{at, source, icon, tone, title, state, detail, user, point_id, ref {type point|automation_run|scene, id}}] e meta {next_before, from, sources [{key, label}]}", responses: { "200": { description: "LogbookItem[]" } } }
  /sites/{id}/history:
    get: { summary: "Histórico de até 12 pontos na mesma janela (qualquer papel; chave: read): point_ids[] e range=1h|6h|24h|7d|30d ou from/to → [{point_id, name, key, unit, kind line|bands, resolution raw|1h|1d, items}] (line: {at, avg, min, max}; bands: {from, to, value, text}) e meta {from, to}. 400 sem point_ids", responses: { "200": { description: "Series[]" }, "400": { $ref: "#/components/responses/Error" } } }
  /sites/{id}/map:
    get: { summary: "Mapa (morador para cima; visitante e operador 403; chave não): {zones [{id, name, lat, lon, radius, home, count}], people [{id, name, initials, zone, home, since, quality, lat, lon, accuracy, precise, track [[lat, lon, at]]}], center [lat, lon]}. ?track=false tira o trajeto do dia", responses: { "200": { description: "Map" }, "403": { $ref: "#/components/responses/Error" } } }
  # ---- App 0.3 (app3): alertas de detecção das câmeras com IA. docs/app.md.
  /sites/{id}/detections:
    get: { summary: "Detecções das câmeras com IA (capacidade detection, qualquer plugin; qualquer papel; chave: read), da mais nova: ?kind=person|vehicle|animal|package|face|other, point_id, limit (até 100), before (cursor) → [{id, point_id, camera, kind, kind_label, label, score, zones, text, event_id, clip, at, snapshot_path}] e meta {next_before, kinds [{key, label}]}. snapshot_path (relativo a /api/v1) = /points/{id}/snapshot?event=… quando o plugin guarda o quadro por evento (Frigate), senão só na detecção de agora. 400 com before inválido", responses: { "200": { description: "Detection[]" }, "400": { $ref: "#/components/responses/Error" } } }
  /sites/{id}/assist:
    post: { summary: "Assistente de voz (só token do app): {text} ou multipart {audio} (STT da instalação), speak? → {heard, text, intent turn_on|turn_off|read_state|scene|ask|unknown, points[], audio_url?}. Intenção local pelos nomes, apelidos (Alexa) e áreas; senão Perguntar à casa. Comando por voz segue papel x risco, respeita a sombra e nunca comanda ponto crítico. 503 ai_unavailable se o STT falhar", responses: { "200": { description: "Resposta" }, "422": { $ref: "#/components/responses/Error" }, "503": { $ref: "#/components/responses/Error" } } }
  /sites/{id}/packages:
    get: { summary: "Pacotes instalados (chave: read): [{id, key, name, version, source_url, description, items, updated_at}]", responses: { "200": { description: "Package[]" } } }
    post: { summary: "Instala ou atualiza pela {url} (repositório GitHub/GitLab com minha-automacao.json|yml na raiz ou URL do manifesto; technician+). Tudo ou nada; nunca executa código", responses: { "201": { description: Package }, "422": { $ref: "#/components/responses/Error" } } }
  /sites/{id}/packages/preview:
    post: { summary: "{url} → {source_url, manifest {key, name, version, description, author}, installed_version, errors[], plan [{type, type_label, key, label, action add|update|remove}]}; nada é gravado (technician+)", responses: { "200": { description: "Prévia" }, "422": { $ref: "#/components/responses/Error" } } }
  /packages/{id}:
    get: { summary: "Pacote com installed [{type, key, id}] e o manifesto em uso (chave: read)", responses: { "200": { description: Package } } }
    patch: { summary: "Atualiza pela fonte (baixa de novo e instala; o que saiu do manifesto é removido) (technician+)", responses: { "200": { description: Package }, "422": { $ref: "#/components/responses/Error" } } }
    delete: { summary: "Remove o pacote e o que ele pôs (blueprints, helpers, painéis, mapas) (technician+)", responses: { "204": { description: ok } } }
  /sites/{id}/dev/states:
    get: { summary: "Ferramentas (só administrador ou dono; chave não): pontos com ?q= (nome, chave, valor) e ?capability= → [{id, key, name, device, capability, helper, value, text, quality, attrs, changed_at, reported_at}] (até 200)", responses: { "200": { description: "State[]" }, "403": { $ref: "#/components/responses/Error" } } }
  /sites/{id}/dev/states/{point_id}:
    post: { summary: "Define o valor de um helper {value} pela regra do tipo (aparelho: 422; painel de alarme recusa)", responses: { "200": { description: State }, "422": { $ref: "#/components/responses/Error" } } }
  /sites/{id}/dev/template:
    post: { summary: "{template, mode liquid|expr} → {result} com o contexto do local; 422 invalid_template com a mensagem", responses: { "200": { description: "{result}" }, "422": { $ref: "#/components/responses/Error" } } }
  /sites/{id}/dev/events:
    post: { summary: "Dispara evento {event, data?} (gatilho Evento e Esperar evento); nome do sistema: 422. Escutar = aba Eventos da web (Turbo Stream)", responses: { "200": { description: "{event}" }, "422": { $ref: "#/components/responses/Error" } } }
  # ---- Fila e jobs (docs/fila.md).
  /system/queue:
    get: { summary: "Fila e jobs (só o dono, numa instalação só; chave não): {summary {ready, claimed, scheduled, blocked, failed, finished_24h, oldest_ready_s, processes_alive, processes}, command_latency {1h|24h: {total, drivers[{driver, ...}]}} com {count, failed, expired, queue {p50, p95, max}, device {p50, p95, max}} em segundos (fila = sent_at - created_at; aparelho = confirmed_at - sent_at), processes[{kind, name, pid, hostname, last_heartbeat_at, alive}], recurring[{key, schedule, job, last_run_at, next_run_at}], jobs[{job, count, failed, avg_s, p95_s, max_s}] (24 h, espera + execução)}; meta {generated_at, windows, unit}", responses: { "200": { description: "{summary, command_latency, processes, recurring, jobs}" }, "403": { $ref: "#/components/responses/Error" } } }
