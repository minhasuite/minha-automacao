openapi: 3.1.0
info:
  title: Minha Automação API
  version: "1.0"
  description: |
    API `/api/v1` do Minha Automação (app Flutter e integrações). Contrato da suíte:
    sucesso `{data, meta?}`, erro `{error: {code, message, details?}}`, datas ISO-8601.
    Paginação Pagy: `?page=&per_page=` e `meta: {page, per_page, count, pages, next, prev}`.

    Auth: `Authorization: Bearer <access>` (30 min; renove com `POST /auth/refresh`)
    ou `X-Api-Key` (integração, só nos recursos com escopo).
    Papéis: `owner` (dono), `admin` (administrador), `member` (membro).

    Base da suíte + F1 (locais, áreas, membros, dispositivos, pontos e comando no driver virtual).
    O resto do domínio (ESQUEMA-V1 §8: histórico, automações, dashboards, borda) entra nas próximas fases.
servers:
  - url: https://minhaautomacao.minhasuite.com/api/v1
security:
  - bearer: []
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }
    apiKey: { type: apiKey, in: header, name: X-Api-Key }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [not_found, validation_failed, unauthorized, forbidden, plan_required, parameter_missing,
                     company_not_empty, invalid_invite, already_member, invalid_credentials, invalid_token,
                     token_reuse_detected, invalid_password, google_unconfigured, verification_failed,
                     ai_unavailable, rate_limited, internal_error]
            message: { type: string }
            details: { type: object }
    Tokens:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, example: Bearer }
        access_expires_at: { type: string, format: date-time }
        refresh_expires_at: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/User" }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [owner, admin, member] }
        role_label: { type: string, example: Dono }
        company: { type: object, properties: { id: { type: string }, name: { type: string }, plan: { type: string } } }
        has_password: { type: boolean }
        google_linked: { type: boolean }
        created_at: { type: string, format: date-time }
    Company:
      type: object
      description: A empresa (tenant). Só o dono altera.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        trade_name: { type: string, nullable: true }
        document: { type: string, nullable: true, description: "Só dígitos (CPF ou CNPJ)" }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        city: { type: string, nullable: true }
        uf: { type: string, nullable: true }
        ibge_code: { type: string, nullable: true }
        plan: { type: string, enum: [free, pro, max] }
        members_count: { type: integer }
        created_at: { type: string, format: date-time }
  responses:
    Error:
      description: erro
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
paths:
  /auth/signup:
    post:
      security: []
      summary: "Cria empresa e dono {name, email, password, company_name?, device_name?}"
      responses: { "201": { description: tokens }, "422": { $ref: "#/components/responses/Error" } }
  /auth/login: { post: { security: [], summary: "E-mail e senha {email, password, device_name?}", responses: { "201": { description: tokens }, "401": { $ref: "#/components/responses/Error" } } } }
  /auth/google: { post: { security: [], summary: "id_token do Google (client web); cria a conta na primeira vez", responses: { "201": { description: tokens }, "401": { $ref: "#/components/responses/Error" }, "503": { $ref: "#/components/responses/Error" } } } }
  /auth/refresh: { post: { security: [], summary: "Rotaciona o par {refresh_token}; reuso de refresh antigo revoga a sessão", responses: { "200": { description: tokens }, "401": { $ref: "#/components/responses/Error" } } } }
  /auth/logout: { delete: { summary: Revoga a sessão atual, responses: { "204": { description: ok } } } }
  /auth/password/forgot: { post: { security: [], summary: "{email}. Sempre 200 (não revela se a conta existe)", responses: { "200": { description: ok } } } }
  /auth/password/reset: { post: { security: [], summary: "{token, password}. Token de 30 min, uso único; derruba as sessões", responses: { "200": { description: ok }, "422": { $ref: "#/components/responses/Error" } } } }
  /me:
    get: { summary: Perfil, responses: { "200": { description: User } } }
    patch: { summary: "{name?, email?, password?, current_password?}", responses: { "200": { description: User }, "422": { $ref: "#/components/responses/Error" } } }
    delete: { summary: "Exclui a conta; o último membro leva a empresa junto", responses: { "204": { description: ok } } }
  /me/export: { get: { summary: Dados da empresa em JSON (LGPD), responses: { "200": { description: ok } } } }
  /me/wipe: { post: { summary: "Zera o conteúdo da empresa (só dono)", responses: { "200": { description: "{deleted: {tabela: n}}" }, "403": { $ref: "#/components/responses/Error" } } } }
  /me/sessions: { get: { summary: Sessões ativas, responses: { "200": { description: ok } } }, delete: { summary: Encerra as outras, responses: { "200": { description: "{revoked}" } } } }
  /me/sessions/{id}: { delete: { summary: Encerra uma sessão, responses: { "204": { description: ok } } } }
  /company:
    get: { summary: A empresa, responses: { "200": { description: Company } } }
    patch: { summary: "Atualiza (só dono)", responses: { "200": { description: Company }, "403": { $ref: "#/components/responses/Error" } } }
  /company/invites: { post: { summary: "Código de convite {role? member|admin} (administrador; só o dono convida admin)", responses: { "201": { description: "{code, role, expires_at}" }, "403": { $ref: "#/components/responses/Error" } } } }
  /company/join: { post: { summary: "Entra com {code, discard_current?}; 409 company_not_empty", responses: { "200": { description: Company }, "409": { $ref: "#/components/responses/Error" }, "422": { $ref: "#/components/responses/Error" } } } }
  /notifications: { get: { summary: "?unread=", responses: { "200": { description: "lista paginada; meta.unread_count" } } } }
  /notifications/{id}/read: { patch: { summary: Marca lida, responses: { "200": { description: ok } } } }
  /notifications/read: { patch: { summary: "Marca todas {ids?}", responses: { "200": { description: "{marked, unread_count}" } } } }
  /device_tokens: { post: { summary: "Token FCM {token, platform android|ios}", responses: { "201": { description: ok } } } }
  /device_tokens/{token}: { delete: { summary: Remove, responses: { "204": { description: ok } } } }
  /api_keys:
    get: { summary: "Chaves de integração ativas (só dono)", responses: { "200": { description: ok } } }
    post: { summary: "{name, scopes: [read|write]} → chave em claro só nesta resposta (só dono)", responses: { "201": { description: ok }, "422": { $ref: "#/components/responses/Error" } } }
  /api_keys/{id}: { delete: { summary: Revoga, responses: { "204": { description: ok } } } }
  /billing: { get: { summary: "Plano da empresa {plan free|pro|max, status, provider, expires_at, auto_renewing, product_id, base_plan, trial, purchased_by_me, purchaser_name, trial_eligible, limits {ai{feature: cota}, ai_tier}, usage {ai}, catalog[]}", responses: { "200": { description: ok } } } }
  /billing/google/verify: { post: { summary: "{purchase_token} → servidor consulta a Play (subscriptionsv2) e devolve o mesmo de /billing; 422 verification_failed", responses: { "200": { description: ok }, "422": { $ref: "#/components/responses/Error" } } } }
  /ai/quota: { get: { summary: "Cota de IA por feature (ask, daily_summary) e teto diário. Grátis: available false", responses: { "200": { description: ok } } } }
  /ai/ask: { post: { summary: "{question} (administrador) → {answer}. Placeholder até o domínio chegar; 402 plan_required fora do plano, 503 ai_unavailable", responses: { "200": { description: ok }, "402": { $ref: "#/components/responses/Error" }, "503": { $ref: "#/components/responses/Error" } } } }
  # ---- Locais, áreas, dispositivos e pontos (F1, ESQUEMA-V1 §4.1–4.3) -------------------------------------------
  # Papel por local (SiteMembership): guest < operator < resident < technician < owner. Dono/administrador da
  # empresa é owner em todos. Sem papel no local = 404. Ver: qualquer papel; cadastro de áreas, dispositivos e
  # pontos: technician+; editar/excluir o local e membros: owner. Comando: normal guest+, sensitive operator+,
  # critical resident+ (403 forbidden abaixo disso).
  /sites:
    get: { summary: "Locais que a pessoa vê (paginado). Cada um traz my_role", responses: { "200": { description: "Site[]" } } }
    post: { summary: "Cria {name, kind home|store|plant, timezone?, address?, latitude?, longitude?, wallpaper?} (administrador da empresa)", responses: { "201": { description: Site }, "403": { $ref: "#/components/responses/Error" }, "422": { $ref: "#/components/responses/Error" } } }
  /sites/{id}:
    get: { summary: Local, responses: { "200": { description: Site }, "404": { $ref: "#/components/responses/Error" } } }
    patch: { summary: "Edita (owner do local)", responses: { "200": { description: Site }, "403": { $ref: "#/components/responses/Error" } } }
    delete: { summary: "Exclui com áreas, dispositivos e pontos (owner do local)", responses: { "204": { description: ok } } }
  /sites/{id}/areas:
    get: { summary: "Áreas (por position, name)", responses: { "200": { description: "Area[]" } } }
    post: { summary: "Cria {name, kind room|floor|outdoor|line|cell|warehouse, parent_id?, icon?, background?, position?} (technician+)", responses: { "201": { description: Area } } }
  /areas/{id}: { get: { summary: Área, responses: { "200": { description: Area } } }, patch: { summary: "Edita (technician+)", responses: { "200": { description: Area } } }, delete: { summary: "Exclui; dispositivos ficam sem área (technician+)", responses: { "204": { description: ok } } } }
  /sites/{id}/members:
    get: { summary: "Membros do local (owner)", responses: { "200": { description: "SiteMembership[] {role, area_ids, expires_at, user{name,email}}" } } }
    post: { summary: "{user_id (da empresa), role guest|operator|resident|technician|owner, expires_at?, area_ids?} (owner)", responses: { "201": { description: SiteMembership }, "404": { $ref: "#/components/responses/Error" } } }
  /members/{id}: { patch: { summary: "{role?, expires_at?, area_ids?} (owner)", responses: { "200": { description: SiteMembership } } }, delete: { summary: "Remove (owner)", responses: { "204": { description: ok } } } }
  /sites/{id}/devices:
    get: { summary: "Dispositivos (?area_id=)", responses: { "200": { description: "Device[]" } } }
    post: { summary: "Cria {name, area_id?, driver virtual|tuya_local|tuya_cloud|xiaomi_miot|alexa|mqtt|modbus_tcp|onvif|go2rtc, manufacturer?, model?, serial?, external_id?, address{}?, firmware?, disabled?} (technician+). Na F1 só o virtual executa comando", responses: { "201": { description: Device } } }
  /devices/{id}: { get: { summary: Dispositivo, responses: { "200": { description: Device } } }, patch: { summary: "Edita (technician+)", responses: { "200": { description: Device } } }, delete: { summary: "Exclui com os pontos (technician+)", responses: { "204": { description: ok } } } }
  /devices/{id}/points:
    get: { summary: Pontos do dispositivo, responses: { "200": { description: "Point[]" } } }
    post: { summary: "Cria {name, capability (§4.3 sem machine/counter), key? (gerada: dispositivo.ponto, única no local), area_id?, unit?, options[]? (obrigatório em enum), min?, max?, step?, writable?, address{}?, scale?, offset?, deadband?, history?, pulse_ms?, max_on_s?, confirm?, risk normal|sensitive|critical, expose{}?, hidden?, disabled?} (technician+)", responses: { "201": { description: Point }, "422": { $ref: "#/components/responses/Error" } } }
  /points/{id}: { get: { summary: "Ponto com value, quality, changed_at, reported_at", responses: { "200": { description: Point } } }, patch: { summary: "Edita (technician+)", responses: { "200": { description: Point } } }, delete: { summary: "Exclui (technician+)", responses: { "204": { description: ok } } } }
  /points/{id}/commands:
    post: { summary: "{command, value?, client_uuid?}: onoff on|off|toggle; dimmer/setpoint set(value na faixa min..max); enum select(value em options); text set; command press; gate pulse. Cria o comando rastreado e responde 202 {command_id, status pending|sent|confirmed|failed|expired, source, error, point_value, sent_at, confirmed_at}; no driver virtual já vem confirmed. Mesmo client_uuid devolve o comando já criado. 422 unsupported_command|invalid_value|not_writable|point_disabled|driver_unavailable; 403 se o papel não alcança o risco", responses: { "202": { description: Command }, "403": { $ref: "#/components/responses/Error" }, "422": { $ref: "#/components/responses/Error" } } }
  /points/{id}/history:
    get: { summary: "?from&to (ISO 8601; padrão: últimas 24h) &resolution auto|raw|1h|1d. auto: até 2 dias cru, até 31 dias 1h, depois 1d; booleano sempre cru. Cru: [{at, value, value_text}] (a primeira linha é o valor vigente em from). Rollup: [{starts_at, min, max, avg, sum, last, count, on_seconds}]. meta {from, to, resolution, truncated} (máx. 5000). 400 invalid_parameter", responses: { "200": { description: "Reading[] ou Rollup[]" }, "400": { $ref: "#/components/responses/Error" } } }
  /commands/{id}:
    get: { summary: "Situação do comando (mesmo formato do 202)", responses: { "200": { description: Command }, "404": { $ref: "#/components/responses/Error" } } }
  # ---- Automação (F4). Ver: qualquer papel no local; criar/editar/excluir: technician+. JSON = linha do banco sem tenant_id. 422 validation_failed com details.
  /sites/{id}/point_links:
    get: { summary: "Espelhamentos do local", responses: { "200": { description: "PointLink[]" } } }
    post: { summary: "Cria {source_point_id, target_point_id, mode mirror|invert|trigger, bidirectional? (mirror/invert entre liga/desliga), trigger_value? (trigger; padrão true), enabled?}. Recusa laço com outros espelhamentos. Anti-eco: não comanda destino já no valor nem devolve o próprio comando (15 s); valor que volta com a conexão não aciona", responses: { "201": { description: PointLink }, "422": { $ref: "#/components/responses/Error" } } }
  /point_links/{id}: { get: { summary: Espelhamento, responses: { "200": { description: PointLink } } }, patch: { summary: "Edita (technician+)", responses: { "200": { description: PointLink } } }, delete: { summary: "Exclui (technician+)", responses: { "204": { description: ok } } } }
  /sites/{id}/schedules:
    get: { summary: "Agendas do local", responses: { "200": { description: "Schedule[]" } } }
    post: { summary: "Cria {name, kind time|sunrise|sunset, time_of_day? HH:MM (time), offset_min? -720..720, days[] 0=domingo..6, point_id + command + value? OU scene_id, enabled?}. Fuso e latitude/longitude do local (sol exige as duas). Devolve next_run_at; atrasada mais de 5 min (servidor fora) é pulada", responses: { "201": { description: Schedule }, "422": { $ref: "#/components/responses/Error" } } }
  /schedules/{id}: { get: { summary: Agenda, responses: { "200": { description: Schedule } } }, patch: { summary: "Edita (technician+)", responses: { "200": { description: Schedule } } }, delete: { summary: "Exclui (technician+)", responses: { "204": { description: ok } } } }
  /sites/{id}/scenes:
    get: { summary: "Cenas do local", responses: { "200": { description: "Scene[]" } } }
    post: { summary: "Cria {name, icon?, items[{point_id, command, value?}]} (comandos de POST /points/{id}/commands)", responses: { "201": { description: Scene }, "422": { $ref: "#/components/responses/Error" } } }
  /scenes/{id}: { get: { summary: Cena, responses: { "200": { description: Scene } } }, patch: { summary: "Edita (technician+)", responses: { "200": { description: Scene } } }, delete: { summary: "Exclui (technician+)", responses: { "204": { description: ok } } } }
  /scenes/{id}/activate:
    post: { summary: "Aciona (papel conforme o ponto de maior risco) → 202 {commands: Command[], errors: [\"Ponto: motivo\"]}; um ponto com erro não impede os outros", responses: { "202": { description: "Comandos" }, "403": { $ref: "#/components/responses/Error" } } }
  /sites/{id}/notify_rules:
    get: { summary: "Avisos do local", responses: { "200": { description: "NotifyRule[]" } } }
    post: { summary: "Cria {point_id, to_value? (vazio = toda mudança), message? ({ponto}, {valor}), channels[] in_app|push, enabled?}. Vai para dono e administradores", responses: { "201": { description: NotifyRule }, "422": { $ref: "#/components/responses/Error" } } }
  /notify_rules/{id}: { get: { summary: Aviso, responses: { "200": { description: NotifyRule } } }, patch: { summary: "Edita (technician+)", responses: { "200": { description: NotifyRule } } }, delete: { summary: "Exclui (technician+)", responses: { "204": { description: ok } } } }
  /sites/{id}/alert_rules:
    get: { summary: "Regras de alerta do local", responses: { "200": { description: "AlertRule[]" } } }
    post: { summary: "Cria {name, point_id, operator eq|ne|gt|lt, value, for_s? (tempo na condição), severity info|warning|critical, escalation[{wait_s (desde a etapa anterior), channels[] in_app|push}], repeat_s? (≥ 60, repete a última etapa), auto_resolve?, enabled?}. Abre um alerta por regra; ciente para de repetir", responses: { "201": { description: AlertRule }, "422": { $ref: "#/components/responses/Error" } } }
  /alert_rules/{id}: { get: { summary: Regra de alerta, responses: { "200": { description: AlertRule } } }, patch: { summary: "Edita (technician+); desativar resolve o alerta aberto", responses: { "200": { description: AlertRule } } }, delete: { summary: "Exclui com os alertas (technician+)", responses: { "204": { description: ok } } } }
  /alerts:
    get: { summary: "?status=open|all (padrão open) dos locais visíveis: [{id, alert_rule_id, name, severity, point_id, point_name, point_value, level (avisos já dados), opened_at, acked_by_id, acked_at, resolved_at}]", responses: { "200": { description: "Alert[]" } } }
  /alerts/{id}: { get: { summary: Alerta, responses: { "200": { description: Alert } } } }
  /alerts/{id}/ack:
    post: { summary: "Ciente (operator+): para o escalonamento; sem auto_resolve, também fecha", responses: { "200": { description: Alert }, "403": { $ref: "#/components/responses/Error" } } }
