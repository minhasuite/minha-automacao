        label: Coordinador USB
        help: 'Coordinador en el USB del servidor: ls /dev/serial/by-id/ (ej.: /dev/serial/by-id/usb-ITead_Sonoff_Zigbee_3.0_USB_Dongle_Plus-if00-port0). Déjelo vacío si va por la red.'
