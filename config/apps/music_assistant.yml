name: Music Assistant
category: Mídia
icon: speakerphone
description: Junta suas bibliotecas e serviços de música e toca nos alto-falantes da casa. Sem descoberta automática de aparelhos (não roda na rede do host).
image: ghcr.io/music-assistant/server
version: "2.5.0"
network: bridge
ports:
  - { container: 8095, host: 8095 }
volumes:
  - { name: data, path: /data }
web_ui: { port: 8095 }
env:
  TZ: America/Sao_Paulo
# Textos em en/es (pt-BR acima); falta = cai no pt-BR.
i18n:
  en:
    category: Media
    description: Brings your music libraries and services together and plays them on the speakers around the house. No automatic device discovery (it doesn't run on the host network).
  es:
    category: Multimedia
    description: Reúne tus bibliotecas y servicios de música y los reproduce en los parlantes de la casa. Sin descubrimiento automático de aparatos (no corre en la red del host).
