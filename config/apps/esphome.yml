name: ESPHome
category: Dispositivos
icon: cube
description: Cria e atualiza firmwares de ESP32/ESP8266 por YAML, com atualização pela rede. Sem descoberta mDNS (o app não roda na rede do host).
image: esphome/esphome
version: "2025.2.0"
network: bridge
ports:
  - { container: 6052, host: 6052 }
volumes:
  - { name: config, path: /config }
web_ui: { port: 6052 }
env:
  TZ: America/Sao_Paulo
options:
  - key: username
    label: Usuário do painel
    type: string
    env: USERNAME
    pattern: '\A[\w.-]{0,40}\z'
  - key: password
    label: Senha do painel
    type: string
    secret: true
    env: PASSWORD
# Textos em en/es (pt-BR acima); falta = cai no pt-BR.
i18n:
  en:
    category: Devices
    description: Builds and updates ESP32/ESP8266 firmware from YAML, with over-the-air updates. No mDNS discovery (the app doesn't run on the host network).
    options:
      username:
        label: Dashboard username
      password:
        label: Dashboard password
  es:
    category: Dispositivos
    description: Crea y actualiza firmwares de ESP32/ESP8266 por YAML, con actualización por la red. Sin descubrimiento mDNS (la app no corre en la red del host).
    options:
      username:
        label: Usuario del panel
      password:
        label: Contraseña del panel
