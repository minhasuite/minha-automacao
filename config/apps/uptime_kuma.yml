name: Uptime Kuma
category: Monitoramento
icon: chart-bar
description: Vigia sites, aparelhos e serviços (ping, HTTP, porta, MQTT) e mostra quando algo cai, com histórico e avisos.
image: louislam/uptime-kuma
version: "1.23.16"
network: bridge
ports:
  - { container: 3001, host: 3001 }
volumes:
  - { name: data, path: /app/data }
web_ui: { port: 3001 }
env:
  TZ: America/Sao_Paulo
