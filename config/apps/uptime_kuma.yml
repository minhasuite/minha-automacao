name: Uptime Kuma
category: Monitoramento
icon: chart-bar
description: Vigia sites, aparelhos e serviços (ping, HTTP, porta, MQTT) e mostra quando algo cai, com histórico e avisos.
image: louislam/uptime-kuma
version: "1.23.16"
network: bridge
ports:
  - { container: 3001, host: 3001 }
volumes:
  - { name: data, path: /app/data }
web_ui: { port: 3001 }
env:
  TZ: America/Sao_Paulo
# Textos em en/es (pt-BR acima); falta = cai no pt-BR.
i18n:
  en:
    category: Monitoring
    description: Watches websites, devices and services (ping, HTTP, port, MQTT) and shows when something goes down, with history and alerts.
  es:
    category: Monitoreo
    description: Vigila sitios, aparatos y servicios (ping, HTTP, puerto, MQTT) y muestra cuando algo se cae, con historial y avisos.
