        password: Contraseña de la API (antigua, si tiene)
      frigate:
        help_html: Usa el puerto sin inicio de sesión de Frigate (5000) en la red de casa. Con Frigate y el servidor en el mismo broker MQTT, la detección llega al instante; sin broker, se lee cada 10 s. Cada cámara se convierte en un aparato con el punto <strong>Detección</strong> (persona, vehículo, animal, zona) para el disparador "Cámara detectó" y el aviso con la imagen.
        topic: Tópico MQTT (opcional)
        url: Dirección de Frigate
      ha_import:
        file: Archivo core.config_entries
        intro_html: 'Elige el archivo <code>/config/.storage/core.config_entries</code> de Home Assistant. Los aparatos de LocalTuya entran con IP, versión y clave local, en el área "Importados de HA". Ejecutarlo de nuevo no duplica: actualiza la clave y la IP.'
        note: 'El archivo tiene secretos de otras integraciones: se lee aquí y se descarta, solo queda LocalTuya.'
      hikvision:
        help: 'Lee los canales por ISAPI (Hikvision) y usa el substream de cada uno. Cuidado con la contraseña: el DVR bloquea al usuario después de algunos intentos fallidos.'
        host: IP del DVR o de la cámara
        http_port: Puerto HTTP
      home_assistant:
        intro: 'Para migrar en modo sombra: Minha Automação lee el registro de Home Assistant (solo lectura) y compara, automatización por automatización, con lo que habrían hecho las automatizaciones en sombra de aquí. Crea un token de acceso de larga duración en tu perfil de Home Assistant y permite su IP en Configuración → Sistema → Salida HTTP.'
        note: El token se guarda cifrado y solo hace lecturas (GET). La comparación corre cada 6 h sobre las últimas 24 h; el resultado queda en Automatizaciones y escenas → Sombra.
        token: Token de acceso de larga duración
        url: Dirección de Home Assistant
      http_messenger:
        body: Cuerpo (opcional)
        headers: 'Encabezados (uno por línea, Nombre: valor)'
        headers_hint: 'apikey: tu-clave'
        help_html: 'Variables: <code>title</code>, <code>message</code>, <code>text</code> (título, cuerpo y enlace), <code>url</code>, <code>image_url</code>, <code>image_base64</code> y <code>buttons</code>. Usa <code>| json</code> para texto dentro de JSON y <code>| url_encode</code> en la dirección. Todo se guarda cifrado. Servidor en la red de casa: permite la IP en Configuración → Sistema.'
        method: Método
        name_hint: WhatsApp por Evolution API
        url: Dirección
      hue:
        key: Clave de la aplicación (opcional)
        key_hint: déjalo vacío para vincular con el botón
        note: 'Para vincular: presiona el botón redondo del Hue Bridge y, en menos de 30 s, haz clic en Agregar. La clave se guarda cifrada. Luces, color, movimiento y temperatura entran como puntos.'
      matter:
        code: Comisionar aparato (opcional)
        code_hint: MT:Y.K9042C00KA0648G00 o 3497-011-2332
        help_html: 'El Matter Server es el mismo de Home Assistant (en el servidor de casa: servicio <code>matter-server</code>, perfil <code>matter</code>, puerto 5580). El código de vinculación está en el aparato o en la caja; el aparato ya debe estar en la red Wi-Fi o Thread. Comisionar tarda hasta 2 min.'
        url: Dirección del Matter Server
      mobile_app:
        intro: 'No hay cuenta: cada celular con la app Minha Automação se convierte en un aparato de este lugar, de la persona que inició sesión en él. En la app, en Más → Sensores del celular, activa lo que quiere enviar: batería, cargando, Wi-Fi y presencia (en casa o fuera, por la ubicación del celular y la del lugar). Úsalos en alertas, automatizaciones y paneles.'
        keep_h: Guardar la ubicación exacta por (horas)
        keep_hint: La coordenada queda solo en este servidor, sin historial, y se borra después de ese tiempo sin lectura nueva. 0 = guarda solo la zona y la distancia a casa.
        radius: Radio de "en casa" (metros)
      mqtt:
        intro: 'Usa el broker MQTT del servidor local (Mosquitto). No hay cuenta para entrar: la tarjeta muestra los aparatos MQTT del lugar y aparecen solos cuando publican.'
        'off': Este servidor no tiene broker MQTT (solo el servidor de casa lo tiene).
        'on': Broker configurado en este servidor.
      network_tracker:
        away: Fuera después de
        help: 'Solo lee: una prueba por dirección cada minuto. Cada dirección se convierte en un aparato con el punto "Conectado", que sirve de fuente para una Persona (Helpers → Persona). El celular se duerme y desaparece de la red: por eso "fuera" solo después del tiempo de arriba sin respuesta. Dale IP fija al celular en el router.'
        hosts: 'Direcciones (una por línea: Nombre = IP o nombre en la red)'
        hosts_hint: Celular de Ana = 192.168.0.23
        method: Cómo probar
        name_hint: Rastreador de red
        port: Puerto (TCP)
      reolink:
        note: Cámara o NVR (un aparato por canal). El puerto 443 usa HTTPS. La detección de personas, vehículos y animales es la del propio aparato, leída cada 5 s.
        password_hint: la de la app Reolink
      shelly:
        note: Gen1 y Plus/Pro se reconocen solos. El estado se lee cada 30 s y justo después de cada comando.
        password: Contraseña (solo si la autenticación está activada)
        password_hint: usuario admin
      spotify:
        help_html: Crea una app en developer.spotify.com/dashboard (Web API), registra la URI de redirección %{uri} y copia aquí el Client ID y el Client Secret. Se guardan cifrados.
      switchbot:
        from_app: de la app SwitchBot
        help: 'En la app SwitchBot: Perfil → Preferencias → toca 10 veces "Versión de la app" → Opciones de desarrollador. El estado se lee cada 5 min (límite de la cuenta) y el comando va por la nube de SwitchBot.'
        secret: Secreto (secret key)
      system:
        intro: 'No hay cuenta: el servidor se convierte en un aparato "Sistema" con puntos de disco, último respaldo, integraciones con error, automatizaciones (activas, ejecuciones y fallas en 24 h) y puntos sin señal, leídos cada 5 min. Úsalos en alertas, automatizaciones y el panel de mantenimiento.'
      tasmota:
        intro: Tasmota se comunica con el broker MQTT del servidor de casa. Con el descubrimiento nativo activado, cada aparato aparece solo, con relés, brillo y sensores.
        step1: En el aparato, en Configuration → MQTT, ingresa la IP del servidor, el puerto 1883 y el usuario y la contraseña del broker.
        step2_html: En la Consola del aparato, ejecuta <code>SetOption19 0</code> (descubrimiento nativo de Tasmota, el predeterminado desde la versión 9.2).
      telegram:
        chat: Chat (id de la conversación)
        chat_hint: Usa Encontrar mi chat
        token: Token del bot
        token_hint: En Telegram, habla con @BotFather, envía /newbot y copia el token. Se guarda cifrado y solo sirve para tu bot.
        webhook: Recibir las respuestas por webhook (necesita la dirección pública con https)
        webhook_hint: Sin webhook, el servidor busca solo las respuestas de los botones en Telegram (funciona sin dirección pública).
      tizen:
        note: 'En la primera lectura la TV pregunta si permite el acceso: acepta con el control en menos de 30 s. El 8002 es la conexión cifrada (predeterminada); el 8001 es la antigua.'
      tuya:
        note: 'Como en Home Assistant: los aparatos de la cuenta, incluso los Zigbee del hub, entran con estado en tiempo real y comandos por la nube de Tuya. Lo que ya está en la red local (LocalTuya) se sigue controlando directo en la red. Conectar aquí no desconecta Home Assistant.'
        step1_html: En el celular, abre la app <strong>Smart Life</strong> (o Tuya Smart).
        step2_html: Toca <strong>Yo</strong> y luego el engranaje (<strong>Configuración</strong>) arriba.
        step3_html: Entra en <strong>Cuenta y seguridad</strong> y copia el <strong>Código de usuario</strong> (distingue mayúsculas).
        step4: Pégalo aquí. En la siguiente pantalla aparece un código QR para escanear con la misma app.
        user_code: Código de usuario
      unifi_protect:
        note: Usa un usuario local (no la cuenta de Ubiquiti en la nube) con acceso solo de lectura a Protect. El certificado de la consola no se verifica.
        username: Usuario local de la consola
        username_hint: crea un usuario solo para Minha Automação
      weather:
        api_key: Clave del proveedor (solo si la pide)
        help: Lee la condición, la temperatura y el pronóstico de 7 días cada 30 min (cámbialo en Intervalo en la tarjeta). Los puntos quedan en un aparato "Clima" del lugar.
        keep: Déjalo vacío para conservar la guardada
        location: Ubicación
        location_blank: vacío = la del lugar
        name_hint: Clima
        provider: Proveedor
      webos:
        note: 'En la primera lectura la TV muestra una solicitud de acceso: acéptala con el control en menos de 1 minuto. Encender por la red solo funciona con "Encender por Wi-Fi/LAN" activo en la TV. Puerto 3001 = conexión cifrada (TVs más nuevas).'
      whatsapp:
        app_secret: Secreto de la app (para los botones)
        intro: 'De tu cuenta de Meta for Developers (app de tipo Empresa con el producto WhatsApp): token de acceso permanente (usuario del sistema), el Phone number ID y el número que recibe los avisos.'
        language: Idioma de la plantilla
        template: Plantilla (opcional)
        template_hint: Meta solo acepta mensajes libres hasta 24 h después de tu último mensaje al número. Con una plantilla aprobada (texto con el parámetro 1), el aviso siempre sale, pero sin foto ni botones.
        to: Número que recibe (con código de país y de área)
        token: Token de acceso
      wled:
        note: Encendido, brillo (0 a 255), color del segmento principal y los efectos del aparato. El estado se lee cada 30 s y justo después de cada comando.
      xiaomi:
        captcha: Texto de la imagen
        captcha_alt: Imagen de verificación de Xiaomi
        captcha_intro: 'Xiaomi pidió verificación: escribe lo que aparece en la imagen y la contraseña de nuevo.'
        help: Inicio de sesión propio, separado de Home Assistant. La cuenta solo lista los aparatos y el token de cada uno; el control es local. Si Xiaomi pide verificación en dos pasos, entra con el código QR de la app Mi Home.
        qr: Entrar con el código QR de Mi Home
        region: Servidor de la cuenta
        username: Correo, teléfono o ID de la cuenta Xiaomi
      yeelight:
        note: En la app Yeelight, activa el "Control por LAN" de la bombilla. Una integración por bombilla (ingresa la IP).
      zigbee2mqtt:
        intro_html: zigbee2mqtt corre en el servidor de casa y se comunica por el mismo broker MQTT. Queda <strong>apagado hasta que llegue el coordinador USB</strong>; una vez encendido, cada aparato vinculado aparece solo, con sus puntos.
        step1_html: Conecta el coordinador al servidor e instala la aplicación Zigbee2MQTT en Configuración → Aplicaciones, con la ruta del coordinador (<code>/dev/serial/by-id/…</code>).
        step2: Vincula los aparatos desde el frontend de zigbee2mqtt (permitir unión).
