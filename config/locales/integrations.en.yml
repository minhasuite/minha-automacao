        step2_html: Point it at the QR code and confirm <strong>Authorize</strong>.
        title: Scan with the Smart Life app
        waiting: Waiting for confirmation in the app…
      whatsapp:
        callback: Callback URL
        hint_html: 'For buttons to answer automations, in the Meta app → WhatsApp → Configuration, register the webhook (needs the public https address) and subscribe to the <code>messages</code> field:'
        no_host: Set up the public address (APP_HOST)
        title: Test and replies
        verify_token: Verify token
      xiaomi:
        qr: Xiaomi sign-in QR code
        step1_html: In Mi Home, tap <strong>+</strong> and then <strong>Scan code</strong> (or use the camera of a phone signed in to the account).
        step2: Confirm the sign-in in the app.
        tfa_hint: 'With a password, the account requires an extra code. The easiest way is to sign in with the QR code: the Mi Home app confirms the sign-in itself, no code needed.'
        tfa_title: Xiaomi asked for two-step verification
        title: Scan with the Mi Home app
        use_qr: Sign in with the QR code
        waiting: Waiting for confirmation…
    flash:
