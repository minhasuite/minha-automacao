    forms:
      ble_proxy:
        key: "API encryption key"
        key_hint: "api: encryption: key from the YAML"
        password: "API password (legacy)"
        password_hint: "only if you use one"
        note: "An ESP32 board with \"bluetooth_proxy:\" in ESPHome. MA listens to advertisements for 10 s and lists the sensors it understands: BTHome (unencrypted), Xiaomi thermometers with pvvx or ATC firmware, and Govee H5072/H5075. Readings arrive every 5 min."
      sonos:
        note: "One Sonos speaker per integration (find it on the network or enter its IP). What's playing, volume and mute are read every minute and right after each command, no cloud."
      daikin:
        note: "A Daikin Wi-Fi adapter (BRP069/BRP072) on the same network. Power, mode, target temperature, fan and room temperature, read every minute."
      midea:
        device_id: "Device ID"
        device_id_hint: "e.g. 151732605161920"
        token: "Token (128 characters)"
        key: "Key (64 characters)"
        from_discover: "from msmart-ng discover"
        note: "For Midea Wi-Fi ACs (V3 protocol). The ID, token and key are pulled once from your account with msmart-ng (\"msmart-ng discover\"); after that everything runs locally. The token and key are stored encrypted."
      zwave_js:
        url: "Z-Wave JS server address"
        note: "The server from the Z-Wave JS add-on, Z-Wave JS UI (with \"WS Server\" turned on) or the zwave-js-server container, with your Z-Wave stick. Nodes show up ready to add, with the relays, dimmers, sensors, meters and thermostats of each one. Including new nodes is still done in Z-Wave JS UI."
      growatt:
        token: "API token"
        from: "from ShineServer"
        note: "Get the token from ShineServer (or ask your installer or Growatt support); it is stored encrypted. Each plant becomes a device with power and energy, read every 5 min, ready for the \"Solar production\" role in the energy dashboards."
      lg_thinq:
        token: "Personal access token (PAT)"
        from: "from connect-pat.lgthinq.com"
        country: "Account country"
        note: "Sign in at connect-pat.lgthinq.com with your LG account, create a token with permission to view and control devices, and paste it here (it is stored encrypted). The account's ACs show up ready to add; their state is read every 2 min."
      sunspec:
        unit: "Modbus unit (ID)"
        note: "Turn on Modbus TCP (SunSpec) on the inverter or data manager (port 502). Read-only, every 30 s: power and energy produced feed the energy dashboards (\"Solar production\" role)."
      govee:
        note: "In the Govee Home app, open the device → Settings → turn on \"LAN Control\". Power, brightness and color go straight over the network (UDP), no cloud; state is read every 30 s."
      dirigera:
        token: "Token (optional)"
        token_hint: "leave blank to pair with the button"
        note: "To pair: click Add, press the action button under the Dirigera and click Add again within 1 minute. The token is stored encrypted. Devices come in with their room from the IKEA Home smart app."
      adb:
        note: 'On the TV: Settings → About → tap "Build" 7 times to unlock developer mode, then turn on "Network debugging" (or "ADB debugging"). On the first read the TV asks "Allow debugging?": check "Always allow" and accept within 30 s.'
      alexa:
        advanced: 'Advanced: paste cookies from a signed-in session'
        cookies: Session cookies
        cookies_hint: 'Only if the sign-in above doesn''t work. A cookies file (alexapy format) or a JSON object {name: value}. This mode doesn''t renew: when Amazon refuses it, the card shows "Error".'
        domain: Amazon site for your account's country
        intro: You sign in with your Amazon account on Amazon's own page (password and two-step verification stay there). The account's Echo devices show up on their own and the session renews without signing in again.
        return_hint: The address has a one-time code that's valid for a few minutes. Only what's needed to renew the session is kept, encrypted in the database.
        return_url: Page address after signing in
      broadlink:
        note: 'Use "Search the network" or enter the IP. The device must be unlocked in the Broadlink app. After adding it, teach each button on the Remote point: type the name, tap Learn and press the button on the original remote pointed at the Broadlink.'
      calendar:
        google: Google account
        google_help: 'Google account: use the "Sign in with Google" button next to this.'
        google_off: needs the Google OAuth client on the server (docs)
        google_on: sign in with Google and read all calendars
        how: How to read the calendar
        ics: iCal link (.ics)
        ics_help_html: 'In Google Calendar (desktop): Settings → the calendar → Integrate calendar → <strong>Secret address in iCal format</strong>. The link gives access to the calendar: it''s stored encrypted and never shown again. Read every 15 min (change it under Interval on the card).'
        ics_hint: works right away, no sign-in
        keep: Leave blank to keep the saved links
        name_hint: Family calendar
        urls: iCal links (one per line)
      camera:
        help: 'Username and password can go in the URL itself (rtsp://user:password@IP/...): the system splits them out and stores the password encrypted, never in the address. Prefer the substream (smaller) and cameras with RTSP over TCP. Motion only through ONVIF, when the camera has events.'
        how: How to find the video
        ip: Camera IP
        keep_url: Leave blank to keep the saved address
        name_hint: Garage camera
        onvif_hint: finds video profiles and the motion sensor on its own
        onvif_mode: ONVIF mode
        onvif_port: ONVIF port
        onvif_port_hint: 80 (many use 8000 or 2020)
        rtsp: RTSP address
        rtsp_hint: any camera that supports RTSP
        rtsp_mode: RTSP mode
      cast:
        note: 'No password needed: Chromecast accepts anyone on the network. Use "Search the network" to find the IP.'
      common:
        host: IP or network name
        keep: Leave blank to keep the saved one
        keep_short: leave blank to keep
        name: Name
        password: Password
        port: Port
        token: Token
        username: Username
      esphome:
        key: API encryption key (if any)
        key_hint: 'base64 from api: encryption: key'
        note: 'The key is in the ESPHome YAML, under api: encryption: key. With no key or password, leave both blank. The key and password are stored encrypted.'
        password: API password (legacy, if any)
      frigate:
        help_html: Use Frigate's no-login port (5000) on your home network. With Frigate and the server on the same MQTT broker, detections arrive instantly; without a broker, they're read every 10 s. Each camera becomes a device with a <strong>Detection</strong> point (person, vehicle, animal, zone) for the "Camera detected" trigger and the alert with a snapshot.
        topic: MQTT topic (optional)
        url: Frigate address
      ha_import:
        file: core.config_entries file
        intro_html: 'Pick the Home Assistant file <code>/config/.storage/core.config_entries</code>. LocalTuya devices come in with IP, version and local key, in the "Imported from HA" area. Running it again won''t duplicate anything: it updates the key and IP.'
        note: 'The file has secrets from other integrations: it''s read here and discarded, only LocalTuya is kept.'
      hikvision:
        help: 'Reads the channels through ISAPI (Hikvision) and uses each one''s substream. Careful with the password: the DVR locks the user after a few wrong attempts.'
        host: DVR or camera IP
        http_port: HTTP port
      home_assistant:
        intro: 'To migrate in shadow mode: Minha Automação reads the Home Assistant logbook (read-only) and compares, automation by automation, with what the shadow automations here would have done. Create a long-lived access token in your Home Assistant profile and allow its IP under Settings → System → Outgoing HTTP.'
        note: The token is stored encrypted and only reads (GET). The comparison runs every 6 h over the last 24 h; results are under Automations and scenes → Shadow.
        token: Long-lived access token
        url: Home Assistant address
      http_messenger:
        body: Body (optional)
        headers: 'Headers (one per line, Name: value)'
        headers_hint: 'apikey: your-key'
        help_html: 'Variables: <code>title</code>, <code>message</code>, <code>text</code> (title, body and link), <code>url</code>, <code>image_url</code>, <code>image_base64</code> and <code>buttons</code>. Use <code>| json</code> for text inside JSON and <code>| url_encode</code> in the URL. Everything is stored encrypted. Server on your home network: allow its IP under Settings → System.'
        method: Method
        name_hint: WhatsApp via Evolution API
        url: URL
      hue:
        key: Application key (optional)
        key_hint: leave blank to pair with the button
        note: 'To pair: press the round button on the Hue Bridge and click Add within 30 s. The key is stored encrypted. Lights, color, motion and temperature come in as points.'
      matter:
        code: Commission a device (optional)
        code_hint: MT:Y.K9042C00KA0648G00 or 3497-011-2332
        help_html: 'The Matter Server is the same one Home Assistant uses (on the home server: service <code>matter-server</code>, profile <code>matter</code>, port 5580). The pairing code is on the device or its box; the device must already be on the Wi-Fi or Thread network. Commissioning takes up to 2 min.'
        url: Matter Server address
      mobile_app:
        intro: 'No account needed: each phone with the Minha Automação app becomes a device in this place, belonging to whoever signed in on it. In the app, under More → Phone sensors, they turn on what to send: battery, charging, Wi-Fi and presence (home or away, from the phone''s location and the place''s address). Use them in alerts, automations and dashboards.'
        keep_h: Keep exact location for (hours)
        keep_hint: The coordinate stays only on this server, with no history, and is deleted after this time without a new reading. 0 = keep only the zone and the distance from home.
        radius: '"At home" radius (meters)'
      mqtt:
        intro: 'Uses the local server''s MQTT broker (Mosquitto). There''s no account to sign in to: the card shows this place''s MQTT devices, and they appear on their own when they publish.'
        'off': This server has no MQTT broker (only the home server does).
        'on': Broker configured on this server.
      network_tracker:
        away: Away after
        help: 'Read-only: one check per address every minute. Each address becomes a device with a "Connected" point, which can feed a Person (Helpers → Person). Phones sleep and drop off the network, so "away" only kicks in after the time above with no answer. Give the phone a fixed IP on your router.'
        hosts: 'Addresses (one per line: Name = IP or network name)'
        hosts_hint: Ana's phone = 192.168.0.23
        method: How to check
        name_hint: Network tracker
        port: Port (TCP)
      reolink:
        note: Camera or NVR (one device per channel). Port 443 uses HTTPS. Person, vehicle and animal detection comes from the device itself, read every 5 s.
        password_hint: the one from the Reolink app
      shelly:
        note: Gen1 and Plus/Pro are detected automatically. State is read every 30 s and right after each command.
        password: Password (only if authentication is on)
        password_hint: admin user
      spotify:
        help_html: Create an app at developer.spotify.com/dashboard (Web API), add the redirect URI %{uri} and copy the Client ID and Client Secret here. They're stored encrypted.
      switchbot:
        from_app: from the SwitchBot app
        help: 'In the SwitchBot app: Profile → Preferences → tap "App version" 10 times → Developer options. State is read every 5 min (account limit) and commands go through the SwitchBot cloud.'
        secret: Secret key
      system:
        intro: 'No account needed: the server becomes a "System" device with points for disk, last backup, integrations with errors, automations (enabled, runs and failures in 24 h) and points with no signal, read every 5 min. Use them in alerts, automations and the maintenance dashboard.'
      tasmota:
        intro: Tasmota talks to the home server's MQTT broker. With native discovery on, each device shows up on its own, with relays, brightness and sensors.
        step1: On the device, under Configuration → MQTT, enter the server IP, port 1883 and the broker username and password.
        step2_html: In the device Console, run <code>SetOption19 0</code> (Tasmota's native discovery, the default since version 9.2).
      telegram:
        chat: Chat (conversation id)
        chat_hint: Use Find my chat
        token: Bot token
        token_hint: In Telegram, talk to @BotFather, send /newbot and copy the token. It's stored encrypted and only works for your bot.
        webhook: Receive replies via webhook (needs the public https address)
        webhook_hint: Without a webhook, the server fetches button replies from Telegram on its own (works without a public address).
      tizen:
        note: 'On the first read the TV asks whether to allow access: accept with the remote within 30 s. 8002 is the encrypted connection (default); 8001 is the old one.'
      tuya:
        note: 'Just like in Home Assistant: the account''s devices, including Zigbee ones on the hub, come in with real-time state and commands through the Tuya cloud. Whatever is already on the local network (LocalTuya) keeps being controlled directly on the network. Connecting here doesn''t disconnect Home Assistant.'
        step1_html: On your phone, open the <strong>Smart Life</strong> app (or Tuya Smart).
        step2_html: Tap <strong>Me</strong> and then the gear (<strong>Settings</strong>) at the top.
        step3_html: Go to <strong>Account and Security</strong> and copy the <strong>User Code</strong> (case-sensitive).
        step4: Paste it here. The next screen shows a QR code to scan with the app itself.
        user_code: User code
      unifi_protect:
        note: Use a local user (not the Ubiquiti cloud account) with read-only access to Protect. The console certificate is not verified.
        username: Console local user
        username_hint: create a user just for Minha Automação
      weather:
        api_key: Provider key (only if it asks for one)
        help: Reads the conditions, temperature and 7-day forecast every 30 min (change it under Interval on the card). The points live on a "Weather" device in this place.
        keep: Leave blank to keep the saved one
        location: Location
        location_blank: blank = the place's
        name_hint: Weather
        provider: Provider
      webos:
        note: 'On the first read the TV shows an access request: accept it with the remote within 1 minute. Turning on over the network only works with "Turn on via Wi-Fi/LAN" enabled on the TV. Port 3001 = encrypted connection (newer TVs).'
      whatsapp:
        app_secret: App secret (for the buttons)
        intro: 'From your Meta for Developers account (a Business-type app with the WhatsApp product): permanent access token (system user), the Phone number ID and the number that receives the alerts.'
        language: Template language
        template: Template (optional)
        template_hint: Meta only accepts free-form messages up to 24 h after your last message to the number. With an approved template (text with parameter 1), the alert always goes out, but without photo or buttons.
        to: Receiving number (with country and area code)
        token: Access token
      wled:
        note: On/off, brightness (0 to 255), main segment color and the device effects. State is read every 30 s and right after each command.
      xiaomi:
        captcha: Text in the image
        captcha_alt: Xiaomi verification image
        captcha_intro: 'Xiaomi asked for verification: type what you see in the image and your password again.'
        help: Its own sign-in, separate from Home Assistant. The account only lists the devices and each one's token; control is local. If Xiaomi asks for two-step verification, sign in with the Mi Home app QR code.
        qr: Sign in with the Mi Home QR code
        region: Account server
        username: Xiaomi account email, phone or ID
      yeelight:
        note: In the Yeelight app, turn on the bulb's "LAN Control". One integration per bulb (enter its IP).
      zigbee2mqtt:
        intro_html: zigbee2mqtt runs on the home server and talks over the same MQTT broker. It stays <strong>off until the USB coordinator arrives</strong>; once it's on, each paired device shows up on its own, with its points.
        step1_html: Plug the coordinator into the server and install the Zigbee2MQTT app under Settings → Apps, with the coordinator path (<code>/dev/serial/by-id/…</code>).
        step2: Pair devices from the zigbee2mqtt frontend (permit join).
