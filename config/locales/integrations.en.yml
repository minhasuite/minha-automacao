      alexa:
        note: Your password never goes through here. On a phone, open the link in the browser (not the Amazon app) so you can copy the address.
        open: Open Amazon sign-in
        step1: Open the Amazon sign-in (new tab) and sign in with your email, password and the verification code if asked.
        step2: 'At the end Amazon shows an error or "page not found" page: that''s expected.'
        step3: Copy that page's full address (from the browser bar) and paste it into "Page address after signing in".
        title: Sign in with your Amazon account
      google:
        hint: Google asks you to allow reading your calendars (read-only). Then you come back here and each calendar becomes a point.
