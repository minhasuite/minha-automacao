pt-BR:
  tapo:
    errors:
      refused: "A câmera recusou a senha da nuvem: use a senha da conta TP-Link (a do app Tapo), não a da conta da câmera."
      tpap: "O firmware desta câmera só aceita o login novo da TP-Link. No app Tapo, ligue Eu → Tapo Lab → Compatibilidade com terceiros e tente de novo."
    points:
      high: "Vídeo (alta)"
      low: "Vídeo (baixa)"
      tele_high: "Vídeo tele (alta)"
      tele_low: "Vídeo tele (baixa)"
      privacy: "Modo privacidade"
      led: "LED de status"
      motion_detection: "Detecção de movimento"
      siren: "Sirene"
  integrations:
    forms:
      tapo:
        username: "Usuário da conta da câmera"
        username_hint: "criado no app Tapo"
        password: "Senha da conta da câmera"
        password_hint: "a do RTSP/ONVIF"
        cloud_password: "Senha da nuvem (opcional)"
        cloud_password_hint: "a da conta TP-Link, para falar e controlar"
        note: "No app Tapo: câmera → engrenagem → Configurações avançadas → Conta da câmera. Porta 2020 é a do ONVIF (vídeo, giro e movimento). Deixe a câmera com IP fixo no roteador."
        control: "Controlar pela API local (privacidade, LED, detecção de movimento e sirene)"
        control_hint: "Pede a senha da nuvem. Em firmware de 2024 em diante, ligue antes no app Tapo: Eu → Tapo Lab → Compatibilidade com terceiros."
en:
