      tpap: "This camera's firmware only accepts TP-Link's new login. In the Tapo app, turn on Me → Tapo Lab → Third-Party Compatibility and try again."
    points:
      high: "Video (high)"
      low: "Video (low)"
      tele_high: "Telephoto video (high)"
      tele_low: "Telephoto video (low)"
      privacy: "Privacy mode"
      led: "Status LED"
      motion_detection: "Motion detection"
      siren: "Siren"
  integrations:
    forms:
      tapo:
        username: "Camera account user"
        username_hint: "created in the Tapo app"
        password: "Camera account password"
        password_hint: "the RTSP/ONVIF one"
        cloud_password: "Cloud password (optional)"
        cloud_password_hint: "the TP-Link account one, to talk and control"
