      title: "Resumo do dia"
      subtitle: "O que aconteceu nas últimas 24 horas"
      open: "Resumo do dia"
      configure: "Configurar"
      quiet_day: "Dia tranquilo: nada a resumir."
      quiet_hint: "Portão, alertas, falhas e baterias baixas aparecem aqui."
      sections:
        openings: "Aberturas"
        alerts: "Alertas"
        failures: "Falhas"
        battery: "Bateria baixa"
        notices: "Avisos"
      opening:
        one: "%{name}: %{value} %{count} vez"
        other: "%{name}: %{value} %{count} vezes"
      alerts:
        one: "%{count} alerta: %{names}"
        other: "%{count} alertas: %{names}"
      failures:
        one: "%{count} comando com falha: %{names}"
        other: "%{count} comandos com falha: %{names}"
      battery: "Bateria baixa: %{names}"
      notices:
        one: "%{count} aviso"
        other: "%{count} avisos"
    settings:
      open: "Preferências"
      nav: "Notificações"
      subtitle: "Silêncio, resumo e o que está silenciado"
      saved: "Preferências de notificação salvas."
      quiet_title: "Meu horário de silêncio"
      quiet_text: "Nesse horário os avisos ficam só no app e na web, sem push no seu celular. Crítico (alarme, vazamento, portão aberto há muito) toca mesmo assim."
      quiet_on: "Ligado"
      from: "De"
      to: "Até"
      digest_title: "Resumo diário"
      digest_text: "Um push só, na hora escolhida, com o que aconteceu: aberturas, alertas, falhas e baterias baixas."
      digest_on: "Mandar o resumo"
      digest_at: "Hora"
