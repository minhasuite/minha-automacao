pt-BR:
  resto:
    backup:
      title: "Fazer backup agora"
      pitch: "Completo ou parcial: o que ficar desmarcado vai sem os dados (a estrutura vai sempre, então o restaurado sobe igual, só sem aquele histórico). Aparece na lista abaixo e restaura pelo mesmo caminho."
      include: "Incluir"
      config: "Configuração (locais, aparelhos, pontos, automações, painéis, pessoas)"
      parts:
        history: "Histórico das leituras, eventos e comandos"
        runs: "Execuções de automações e da voz, avisos"
        recordings: "Índice das gravações das câmeras"
        logs: "Auditoria e logs"
      now: "Fazer backup"
      working: "Fazendo o backup…"
      created: "Backup %{name} criado."
      failed: "O backup falhou: %{error}"
    host:
      title: "Configurar a rede do servidor"
      pitch: "Endereço fixo ou automático (DHCP) numa interface e conexão Wi-Fi, pelo NetworkManager da máquina. Errar o endereço tira o servidor da rede: confira antes."
      interface: "Interface"
      mode: "Endereço"
      dhcp: "Automático (DHCP)"
      static: "Fixo"
      address: "IP/máscara"
      static_hint: "Só vale no endereço fixo. Separe os DNS por vírgula."
      apply: "Aplicar"
      confirm: "Aplicar na rede do servidor agora? Se algo estiver errado, ele pode sair da rede até alguém corrigir na própria máquina."
      network_saved: "Rede do servidor atualizada. Se o endereço mudou, abra o Minha Automação pelo endereço novo."
      wifi: "Wi-Fi"
      scan: "Procurar redes Wi-Fi"
      no_wifi: "Nenhuma rede Wi-Fi encontrada (a máquina tem Wi-Fi?)."
      ssid: "Rede (SSID)"
      wifi_password: "Senha do Wi-Fi"
      connect: "Conectar"
      wifi_saved: "Conectando o servidor ao Wi-Fi %{ssid}."
en:
  resto:
    backup:
      title: "Back up now"
      pitch: "Full or partial: whatever is unchecked goes without its data (the structure always goes, so the restored copy starts the same, just without that history). It shows up in the list below and restores the same way."
      include: "Include"
      config: "Configuration (places, devices, points, automations, dashboards, people)"
      parts:
        history: "History of readings, events and commands"
        runs: "Automation and voice runs, notifications"
        recordings: "Camera recordings index"
        logs: "Audit and logs"
      now: "Back up"
      working: "Backing up…"
      created: "Backup %{name} created."
      failed: "The backup failed: %{error}"
    host:
      title: "Configure the server network"
      pitch: "Fixed or automatic (DHCP) address on an interface and Wi-Fi connection, through the machine's NetworkManager. A wrong address takes the server off the network: double-check first."
      interface: "Interface"
      mode: "Address"
      dhcp: "Automatic (DHCP)"
      static: "Fixed"
      address: "IP/mask"
      static_hint: "Only for a fixed address. Separate DNS servers with commas."
      apply: "Apply"
      confirm: "Apply to the server network now? If something is wrong, it may drop off the network until someone fixes it on the machine itself."
      network_saved: "Server network updated. If the address changed, open Minha Automação at the new address."
      wifi: "Wi-Fi"
      scan: "Scan for Wi-Fi networks"
      no_wifi: "No Wi-Fi network found (does the machine have Wi-Fi?)."
      ssid: "Network (SSID)"
      wifi_password: "Wi-Fi password"
      connect: "Connect"
      wifi_saved: "Connecting the server to Wi-Fi %{ssid}."
es:
  resto:
    backup:
      title: "Hacer respaldo ahora"
      pitch: "Completo o parcial: lo que quede sin marcar va sin sus datos (la estructura va siempre, así que lo restaurado arranca igual, solo sin ese historial). Aparece en la lista de abajo y se restaura por el mismo camino."
      include: "Incluir"
      config: "Configuración (lugares, aparatos, puntos, automatizaciones, paneles, personas)"
      parts:
        history: "Historial de lecturas, eventos y comandos"
        runs: "Ejecuciones de automatizaciones y de la voz, avisos"
        recordings: "Índice de las grabaciones de las cámaras"
        logs: "Auditoría y registros"
      now: "Hacer respaldo"
      working: "Haciendo el respaldo…"
      created: "Respaldo %{name} creado."
      failed: "El respaldo falló: %{error}"
    host:
      title: "Configurar la red del servidor"
      pitch: "Dirección fija o automática (DHCP) en una interfaz y conexión Wi-Fi, por el NetworkManager de la máquina. Una dirección equivocada saca el servidor de la red: revisa antes."
      interface: "Interfaz"
      mode: "Dirección"
      dhcp: "Automática (DHCP)"
      static: "Fija"
      address: "IP/máscara"
      static_hint: "Solo vale para la dirección fija. Separa los DNS con comas."
      apply: "Aplicar"
      confirm: "¿Aplicar en la red del servidor ahora? Si algo está mal, puede quedar fuera de la red hasta que alguien lo corrija en la propia máquina."
      network_saved: "Red del servidor actualizada. Si la dirección cambió, abre Minha Automação en la dirección nueva."
      wifi: "Wi-Fi"
      scan: "Buscar redes Wi-Fi"
      no_wifi: "No se encontró ninguna red Wi-Fi (¿la máquina tiene Wi-Fi?)."
      ssid: "Red (SSID)"
      wifi_password: "Contraseña del Wi-Fi"
      connect: "Conectar"
      wifi_saved: "Conectando el servidor al Wi-Fi %{ssid}."
