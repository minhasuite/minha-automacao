pt-BR:
  security:
    nav: "Segurança"
    subtitle: "Segurança da conta"
    "on": "Ligada"
    "off": "Desligada"
    totp:
      title: "Verificação em duas etapas"
      pitch: "Além da senha, pede um código de 6 dígitos do app autenticador (Google Authenticator, Microsoft Authenticator, 1Password, Aegis...)."
      qr: "QR code para o app autenticador"
      step1: "Abra o app autenticador e escolha adicionar conta."
      step2: "Leia o QR code ou digite a chave:"
      step3: "Digite o código de 6 dígitos que o app mostrar."
      code: "Código"
      enable: "Ligar"
      disable: "Desligar"
      enabled: "Verificação em duas etapas ligada. Guarde os códigos de recuperação."
      disabled: "Verificação em duas etapas desligada."
      bad_code: "Código inválido."
    recovery:
      title: "Códigos de recuperação"
      save: "Guarde num lugar seguro. Cada código entra uma vez, se o celular sumir. Eles não aparecem de novo."
      copy: "Copiar"
      left:
        one: "Resta 1 código de recuperação."
        other: "Restam %{count} códigos de recuperação."
      renew: "Gerar novos códigos"
      renew_confirm: "Os códigos antigos param de valer. Gerar novos?"
      renewed: "Códigos novos gerados. Os antigos não valem mais."
    passkeys:
      title: "Passkeys"
      pitch: "Entre sem senha, com a digital, o rosto ou o PIN do aparelho. A passkey fica no aparelho (ou no gerenciador de senhas) e não serve em outro site."
      name: "Nome"
      name_ph: "Celular da Ana"
      add: "Adicionar passkey"
      added: "Passkey adicionada."
      failed: "Não deu para confirmar a passkey."
      removed: "Passkey removida."
      remove: "Remover"
      remove_of: "Remover a passkey %{name}"
      remove_confirm: "Remover a passkey %{name}?"
      added_at: "adicionada %{at}"
      used_at: "usada %{at}"
      unsupported: "Este navegador não tem passkeys."
    google:
      title: "Conta Google"
      "on": "Vinculada"
      "off": "Não vinculada"
      pitch: "Entre com o botão do Google, sem digitar senha. A verificação em duas etapas continua valendo."
      unlink: "Desvincular"
      unlink_confirm: "Desvincular a conta Google? Depois, entre com a senha ou a passkey."
      linked: "Conta Google vinculada."
      unlinked: "Conta Google desvinculada."
      link_failed: "Não deu para vincular: o token do Google não vale ou essa conta Google já está em outra pessoa."
      last_credential: "Crie uma senha ou uma passkey antes de desvincular, para não ficar sem como entrar."
      unavailable_here: "Para vincular, abra esta tela pelo endereço externo (https) do servidor."
    login:
      title: "Verificação em duas etapas"
      lead: "Digite o código do app autenticador."
      submit: "Entrar"
      recovery_hint: "Sem o celular? Use um dos códigos de recuperação."
      back: "Voltar"
      expired: "A verificação expirou. Entre de novo."
      passkey: "Entrar com passkey"
en:
  security:
    nav: "Security"
    subtitle: "Account security"
    "on": "On"
    "off": "Off"
    totp:
      title: "Two-step verification"
      pitch: "Besides the password, asks for a 6-digit code from an authenticator app (Google Authenticator, Microsoft Authenticator, 1Password, Aegis...)."
      qr: "QR code for the authenticator app"
      step1: "Open the authenticator app and choose to add an account."
      step2: "Scan the QR code or type the key:"
      step3: "Type the 6-digit code the app shows."
      code: "Code"
      enable: "Turn on"
      disable: "Turn off"
      enabled: "Two-step verification is on. Keep the recovery codes."
      disabled: "Two-step verification is off."
      bad_code: "Invalid code."
    recovery:
      title: "Recovery codes"
      save: "Keep them somewhere safe. Each code works once, if your phone goes missing. They won't be shown again."
      copy: "Copy"
      left:
        one: "1 recovery code left."
        other: "%{count} recovery codes left."
      renew: "Generate new codes"
      renew_confirm: "The old codes stop working. Generate new ones?"
      renewed: "New codes generated. The old ones no longer work."
    passkeys:
      title: "Passkeys"
      pitch: "Sign in without a password, with the fingerprint, face or PIN of the device. The passkey stays on the device (or password manager) and does not work on another site."
      name: "Name"
      name_ph: "Ana's phone"
      add: "Add passkey"
      added: "Passkey added."
      failed: "Couldn't confirm the passkey."
      removed: "Passkey removed."
      remove: "Remove"
      remove_of: "Remove the passkey %{name}"
      remove_confirm: "Remove the passkey %{name}?"
      added_at: "added %{at}"
      used_at: "used %{at}"
      unsupported: "This browser has no passkeys."
    google:
      title: "Google account"
      "on": "Linked"
      "off": "Not linked"
      pitch: "Sign in with the Google button, no password to type. Two-step verification still applies."
      unlink: "Unlink"
      unlink_confirm: "Unlink the Google account? Afterwards, sign in with your password or passkey."
      linked: "Google account linked."
      unlinked: "Google account unlinked."
      link_failed: "Could not link: the Google token is not valid or that Google account already belongs to someone else."
      last_credential: "Create a password or a passkey before unlinking, so you don't lose access."
      unavailable_here: "To link, open this page through the server's external (https) address."
    login:
      title: "Two-step verification"
      lead: "Type the code from the authenticator app."
      submit: "Sign in"
      recovery_hint: "No phone? Use one of the recovery codes."
      back: "Back"
      expired: "The verification expired. Sign in again."
      passkey: "Sign in with a passkey"
es:
  security:
    nav: "Seguridad"
    subtitle: "Seguridad de la cuenta"
    "on": "Activada"
    "off": "Desactivada"
    totp:
      title: "Verificación en dos pasos"
      pitch: "Además de la contraseña, pide un código de 6 dígitos de la app autenticadora (Google Authenticator, Microsoft Authenticator, 1Password, Aegis...)."
      qr: "Código QR para la app autenticadora"
      step1: "Abra la app autenticadora y elija agregar cuenta."
      step2: "Lea el código QR o escriba la clave:"
      step3: "Escriba el código de 6 dígitos que muestre la app."
      code: "Código"
      enable: "Activar"
      disable: "Desactivar"
      enabled: "Verificación en dos pasos activada. Guarde los códigos de recuperación."
      disabled: "Verificación en dos pasos desactivada."
      bad_code: "Código no válido."
    recovery:
      title: "Códigos de recuperación"
      save: "Guárdelos en un lugar seguro. Cada código sirve una vez, si el móvil se pierde. No se mostrarán de nuevo."
      copy: "Copiar"
      left:
        one: "Queda 1 código de recuperación."
        other: "Quedan %{count} códigos de recuperación."
      renew: "Generar códigos nuevos"
      renew_confirm: "Los códigos antiguos dejan de valer. ¿Generar nuevos?"
      renewed: "Códigos nuevos generados. Los antiguos ya no valen."
    passkeys:
      title: "Llaves de acceso"
      pitch: "Entre sin contraseña, con la huella, el rostro o el PIN del dispositivo. La llave queda en el dispositivo (o en el gestor de contraseñas) y no sirve en otro sitio."
      name: "Nombre"
      name_ph: "Móvil de Ana"
      add: "Agregar llave de acceso"
      added: "Llave de acceso agregada."
      failed: "No se pudo confirmar la llave de acceso."
      removed: "Llave de acceso eliminada."
      remove: "Eliminar"
      remove_of: "Eliminar la llave de acceso %{name}"
      remove_confirm: "¿Eliminar la llave de acceso %{name}?"
      added_at: "agregada %{at}"
      used_at: "usada %{at}"
      unsupported: "Este navegador no tiene llaves de acceso."
    google:
      title: "Cuenta de Google"
      "on": "Vinculada"
      "off": "No vinculada"
      pitch: "Entra con el botón de Google, sin escribir contraseña. La verificación en dos pasos sigue valiendo."
      unlink: "Desvincular"
      unlink_confirm: "¿Desvincular la cuenta de Google? Después, entra con la contraseña o la passkey."
      linked: "Cuenta de Google vinculada."
      unlinked: "Cuenta de Google desvinculada."
      link_failed: "No se pudo vincular: el token de Google no es válido o esa cuenta de Google ya es de otra persona."
      last_credential: "Crea una contraseña o una passkey antes de desvincular, para no quedarte sin acceso."
      unavailable_here: "Para vincular, abre esta pantalla por la dirección externa (https) del servidor."
    login:
      title: "Verificación en dos pasos"
      lead: "Escriba el código de la app autenticadora."
      submit: "Entrar"
      recovery_hint: "¿Sin el móvil? Use uno de los códigos de recuperación."
      back: "Volver"
      expired: "La verificación expiró. Entre de nuevo."
      passkey: "Entrar con llave de acceso"
