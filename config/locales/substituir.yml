      keep_old: "Don't map (stays on the old device)"
      invert: "Invert (true ↔ false)"
      invert_suggested: "Suggested: the new device uses the opposite sense (e.g. contact true = closed)."
      retire: "Old device"
      retire_hint: "Remove only marks it removed if no point is left; otherwise it is disabled."
      retire_options:
        remove: "Mark as removed"
        disable: "Disable"
        keep: "Leave as is"
      preview: "Preview"
      cancel: "Cancel"
      preview_title: "Replacement preview"
      confirm: "Move the points from %{old} to %{new}?"
