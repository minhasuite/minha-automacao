      moves: "Points that change device"
      moves_hint: "The point on the left stays (same id) and takes the address of the one on the right, which is deleted."
      keeps:
        zero: "No references to the point"
        one: "1 reference keeps pointing right"
        other: "%{count} references keep pointing right"
      inverted: "inverted"
      new_used: "The new point is already used in: %{what}. Those links of the new point are lost."
      unchanged: "What doesn't change"
      old_left:
        zero: "Every old point has a pair."
        one: "1 old point without a pair stays on the old device: %{names}."
        other: "%{count} old points without a pair stay on the old device: %{names}."
      new_left:
        zero: "No new point is left over."
        one: "1 new point without a pair stays as is: %{names}."
        other: "%{count} new points without a pair stay as they are: %{names}."
      retire_result:
        remove: "%{name} will be marked as removed."
        disable: "%{name} will be disabled."
        keep: "%{name} stays as is."
      back_edit: "Back to the mapping"
      done:
        one: "1 point moved to the new device."
        other: "%{count} points moved to the new device."
      undone: "Replacement undone: the points are back on the old device."
      replaced_title: "Device replaced"
      replaced: "The points were moved to %{name} on %{at} (%{count} pairs)."
      open_new: "Open the new device"
      undo: "Undo"
      undo_confirm: "Return the points to this device, with their previous addresses?"
      errors:
        old_point: "Old point not found on this device."
        new_point: "New point not found on the chosen device."
        twice: "The new point %{name} was chosen twice."
        incompatible: "%{old} and %{new} don't have the same kind of value."
        same_site: "Choose another device from the same site."
        empty: "Choose at least one pair of points."
        undone: "There is no replacement to undo."
