# P3 da proposta de personalização: verificações da Saúde, texto dos avisos e voz da casa.
en:
  activerecord:
    errors:
      messages:
        invalid_template: 'has a broken text: %{error}'
        invalid_query: 'has a broken query: %{error}'
        condition_missing: Fill in the query, the expression or both.
        target_missing: Choose a scene or a script (just one).
        critical_target: A critical scene or script can't be triggered by voice.
        not_script: must be a script of this place
        invalid_sentence: 'has an error in "%{sentence}": %{error}'
    attributes:
      custom_health_check:
        name: Name
        query: Query
        expression: Expression
        message: Text
        severity: Severity
        site: Place
      assist_custom_intent:
        name: Name
        sentences: Sentences
