      tariffs_ph: "Peak, Off-peak"
      tariffs_hint_html: "The first one is active at the start. Switch it with the \"Command point\" action → Switch rate (in a time-based automation). Each rate's consumption goes in the <code>tariffs</code> attribute; the previous cycle, in <code>last_period</code>. If the device resets its count, nothing is lost."
