      min: "Minimum length"
      max: "Maximum length"
      pattern: "Pattern (regular expression, optional)"
      password: "Password mode (the value is hidden on screen)"
    threshold:
      lower: "Lower limit"
      upper: "Upper limit"
      hysteresis: "Hysteresis"
      hint: "Lower only: on below it. Upper only: on above it. Both: on inside the range. Hysteresis prevents flapping near the limit."
    timer:
      duration: "Duration"
      hint: "\"Start\" can take a different duration. When it ends, the value becomes \"Finished\": use the \"Point changed\" trigger set to \"Finished\". It keeps counting if the server restarts."
    toggle:
      initial: "Starts on"
    trend:
      gradient: "Minimum gradient (per second)"
      min_samples: "Minimum samples"
      max_samples: "Maximum samples"
      invert: "Invert (on when falling)"
      hint: "E.g. 1 °C per hour = 0.000278 per second."
