    template:
      kind: "Result"
      unit: "Unit (number)"
      expr: "Expression"
      expr_hint_html: "Number and on/off: points by key, with + - * /, comparisons, and/or, if(), round(), min(), max(). Text: <span class=\"num\">{{ points[\"sala.luz\"].text }}</span>. It recalculates when a referenced point changes. <span class=\"num\">previous</span> is the previous value (accumulator: <span class=\"num\">previous + sala.kwh</span>). Date and time: seconds (<span class=\"num\">timestamp + 3600</span>) or text."
      every: "Every (optional)"
      every_hint: "With this, it recalculates on the clock instead of when the source changes."
      attrs: "Attributes (optional)"
      attrs_hint_html: "One per line, \"name: text\". They show up in the Number widget (Attribute field) and in text as <span class=\"num\">points[\"key\"].attrs.name</span>."
