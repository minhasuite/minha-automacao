      hint: Toca el micrófono, habla y toca de nuevo; o escribe la frase y envía.
      pipeline: Pipeline
      no_pipeline: Predeterminado del lugar
      text: O escribe
      execute: Ejecutar de verdad (controla los aparatos)
      speak: Generar el habla
      send: Probar
      failed: La prueba falló
      result: Resultado de la prueba
      heard: Oí
      intent: Comando
      reply: Respuesta
      voice: Habla generada
      stages: Etapas y tiempo
      status: Ahora
      online: Con internet
      no_cloud: Nube prohibida en este pipeline
      check: Verificar la voz local
      no_servers: Ningún servidor Wyoming configurado (instala las apps Whisper y Piper y usa Conectar).
      ms: "%{ms} ms"
      kinds:
        stt: Voz a texto
        ai: Frases fuera de los comandos
        tts: Habla
      modes:
        local: Local (en la casa)
        cloud: Nube
        none: No disponible
        "off": Solo comandos de la casa
      where:
        local: local
        cloud: nube
    latency:
      title: Tiempo de respuesta
      hint: Mediana de las últimas ejecuciones sin error (p95 y cuántas al lado).
      empty: Ninguna ejecución todavía. Haz una prueba.
      total: Total
      p95: p95 %{ms} ms · %{n} ejecuciones
