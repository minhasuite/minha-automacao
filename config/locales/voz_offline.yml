    offline:
      badge: Modo sin conexión
      hint: Sin internet la casa entiende sus comandos ("enciende la luz de la sala"); las preguntas libres esperan a que vuelva internet.
      no_stt: Sin voz a texto ahora. Instala la app Whisper (voz local) o restablece internet.
      no_tts: Sin habla ahora. Instala la app Piper (voz local) o restablece internet.
    test:
      would: 'Entendí: %{intent}'
      none: No reconocí ningún comando de la casa en esta frase.
  assist_settings:
