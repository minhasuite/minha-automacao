pt-BR:
  server_vitals:
    none: Nenhuma queda registrada
    "off":
      title: "O servidor ficou desligado por %{duration}"
      body: "Parado de %{from} a %{to}: sem automações, avisos nem câmeras nesse tempo. Se não foi você, confira energia e temperatura."
    network:
      title: "O servidor ficou sem internet por %{duration}"
      body: "Sem internet de %{from} a %{to}: avisos, Alexa e acesso de fora pararam nesse tempo."
    hot:
      title: "Servidor quente: %{temp} °C"
      body: "A CPU está em %{temp} °C há mais de 2 minutos (limite de atenção: %{limit} °C). Perto de 114 °C ele desliga sozinho: confira a ventilação."
    last:
      network: "Sem internet por %{duration} (%{from} a %{to})"
      "off": "Desligado por %{duration} (%{from} a %{to})"
en:
  server_vitals:
    none: No outage recorded
    "off":
      title: "The server was off for %{duration}"
      body: "Down from %{from} to %{to}: no automations, notifications or cameras in that time. If it wasn't you, check power and temperature."
    network:
      title: "The server had no internet for %{duration}"
      body: "No internet from %{from} to %{to}: notifications, Alexa and remote access stopped in that time."
