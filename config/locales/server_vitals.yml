      title: "Server running hot: %{temp} °C"
      body: "The CPU has been at %{temp} °C for over 2 minutes (warning limit: %{limit} °C). Near 114 °C it shuts itself down: check the airflow."
    last:
      network: "No internet for %{duration} (%{from} to %{to})"
      "off": "Off for %{duration} (%{from} to %{to})"
