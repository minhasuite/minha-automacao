# Fila e jobs (Configurações → Fila; docs/fila.md).
pt-BR:
  queue:
    nav: "Fila"
    subtitle: "Fila e jobs"
    refreshed: "Atualiza a cada 10 s · %{at}"
    from_health: "Fila e jobs"
    time_format: "%d/%m %H:%M:%S"
    retry: "Tentar de novo"
    retried: "Job de volta na fila."
    discard: "Descartar"
    discarded: "Job descartado."
    discard_confirm: "Descartar o job %{job}? Ele não vai rodar mais."
    units:
      ms: "%{n} ms"
      s: "%{n} s"
      min: "%{m} min %{s} s"
    summary:
      title: "Agora"
      ready: "Pendentes"
      claimed: "Em execução"
      scheduled: "Agendados"
      failed: "Com erro"
      finished_24h: "Concluídos em 24 h"
      processes: "Processos vivos"
      oldest: "o mais antigo espera há %{time}"
      attention: "ver abaixo"
      no_worker: "nenhum worker"
    latency:
      title: "Latência dos comandos"
      hint: "Fila = do pedido até o worker começar. Aparelho = do envio até o aparelho confirmar. Se a fila for alta, o atraso é do servidor; se o aparelho for alto, é da rede ou do aparelho."
      verdict: "Na última hora, %{n} comandos: 95% saíram da fila em até %{queue} e o aparelho respondeu em até %{device}."
      window:
        1h: "Última hora"
        24h: "Últimas 24 h"
      all: "Todos"
      driver: "Driver"
      count: "Comandos"
      failed_hint: "Falharam ou expiraram"
      queue: "Fila (p50 · p95 · máx)"
      device: "Aparelho (p50 · p95 · máx)"
      queue_short: "Fila"
      device_short: "Aparelho"
      legend: "p50 = metade dos comandos levou até isso; p95 = 95 de cada 100; máx = o pior."
    commands:
      failed: "Comandos com falha (24 h)"
      recent: "Últimos comandos"
      empty: "Nenhum comando ainda."
      when: "Quando"
      point: "Ponto"
      status: "Situação"
    jobs:
      title: "Jobs nas últimas 24 h"
      hint: "Tempo = de quando o job ficou pronto até terminar (espera + execução): o Solid Queue não guarda quando ele começou. A espera separada aparece em Em execução e, para comandos, na latência acima."
      empty: "Nenhum job terminou nas últimas 24 h."
      job: "Job"
      count: "Concluídos"
      failed: "Falhas"
      avg: "Média"
      p95: "p95"
      max: "Máximo"
    tabs:
      label: "Jobs"
      execucao: "Em execução"
      agendados: "Agendados"
      erros: "Com erro"
      concluidos: "Concluídos"
      showing: "Mostrando %{n} de %{total}."
      empty:
        execucao: "Nenhum job rodando agora"
        agendados: "Nenhum job agendado"
        erros: "Nenhum job com erro"
        concluidos: "Nenhum job concluído nas últimas 24 h"
    list:
      since: "Desde"
      running_for: "rodando há %{time}"
      waited: "Esperou"
      process: "Processo"
      at: "Para"
      queue: "Fila"
      finished_at: "Terminou"
      total: "Espera + execução"
    processes:
      title: "Processos"
      empty: "Nenhum processo da fila registrado."
      name: "Processo"
      heartbeat: "Último sinal"
      alive: "Vivo"
      dead: "Sem sinal"
    recurring:
      title: "Tarefas recorrentes"
      empty: "Nenhuma tarefa recorrente registrada."
      task: "Tarefa"
      last: "Última"
      next: "Próxima"
en:
  queue:
    nav: "Queue"
    subtitle: "Queue and jobs"
    refreshed: "Refreshes every 10 s · %{at}"
    from_health: "Queue and jobs"
    time_format: "%m/%d %H:%M:%S"
    retry: "Retry"
    retried: "Job is back in the queue."
    discard: "Discard"
    discarded: "Job discarded."
    discard_confirm: "Discard job %{job}? It will not run again."
    units:
      ms: "%{n} ms"
      s: "%{n} s"
      min: "%{m} min %{s} s"
    summary:
      title: "Now"
      ready: "Pending"
      claimed: "Running"
      scheduled: "Scheduled"
      failed: "Failed"
      finished_24h: "Finished in 24 h"
      processes: "Live processes"
      oldest: "oldest waiting for %{time}"
      attention: "see below"
      no_worker: "no worker"
    latency:
      title: "Command latency"
      hint: "Queue = from the request until the worker starts. Device = from sending until the device confirms. A high queue time means the server is the delay; a high device time means the network or the device."
      verdict: "In the last hour, %{n} commands: 95% left the queue within %{queue} and the device answered within %{device}."
      window:
        1h: "Last hour"
        24h: "Last 24 h"
      all: "All"
      driver: "Driver"
      count: "Commands"
      failed_hint: "Failed or expired"
      queue: "Queue (p50 · p95 · max)"
      device: "Device (p50 · p95 · max)"
      queue_short: "Queue"
      device_short: "Device"
      legend: "p50 = half of the commands took up to this; p95 = 95 out of 100; max = the worst."
    commands:
      failed: "Failed commands (24 h)"
      recent: "Latest commands"
      empty: "No commands yet."
      when: "When"
      point: "Point"
      status: "Status"
    jobs:
      title: "Jobs in the last 24 h"
      hint: "Time = from when the job became ready until it finished (wait + run): Solid Queue does not store when it started. The separate wait shows under Running and, for commands, in the latency above."
      empty: "No job finished in the last 24 h."
      job: "Job"
      count: "Finished"
      failed: "Failures"
      avg: "Average"
      p95: "p95"
      max: "Max"
    tabs:
      label: "Jobs"
      execucao: "Running"
      agendados: "Scheduled"
      erros: "Failed"
      concluidos: "Finished"
      showing: "Showing %{n} of %{total}."
      empty:
        execucao: "No job running now"
        agendados: "No scheduled job"
        erros: "No failed job"
        concluidos: "No job finished in the last 24 h"
    list:
      since: "Since"
      running_for: "running for %{time}"
      waited: "Waited"
      process: "Process"
      at: "At"
      queue: "Queue"
      finished_at: "Finished"
      total: "Wait + run"
    processes:
      title: "Processes"
      empty: "No queue process registered."
      name: "Process"
      heartbeat: "Last heartbeat"
      alive: "Alive"
      dead: "No heartbeat"
    recurring:
      title: "Recurring tasks"
      empty: "No recurring task registered."
      task: "Task"
      last: "Last"
      next: "Next"
