# Configurações → Aparência (ondaB2 B11): tema de cada pessoa, temas da casa e barra lateral.
pt-BR:
  appearance:
    nav: Aparência
    subtitle: Tema de cada pessoa, densidade e a barra lateral
    saved: Aparência salva.
    too_many: "A casa já tem %{max} temas."
    unknown: Tema não existe.
    wallpapers:
      glow: Brilhos
      mesh: Malha
      solid: Cor lisa
      none: Sem papel de parede
    fonts:
      manrope: Manrope (padrão)
      system: Do sistema
      rounded: Arredondada
      serif: Com serifa
      mono: Monoespaçada
    density:
      title: Densidade
      pitch: "Tamanho de botões, campos e espaços. Compacta cabe mais no painel e no computador; confortável deixa os alvos maiores (o tablet da parede, por exemplo). Vale neste aparelho, junto com o claro/escuro."
    theme:
      title: Meu tema
      pitch: "O tema escolhido vale por inteiro em todas as telas (cores, fundo, vidro e escuro), por cima do desenho de cada painel. No perfil, vai com você para todo aparelho; neste aparelho, só aqui (o tablet da parede, por exemplo). Para voltar às fotos e fundos de cada painel, use \"Perfil segue o painel\"."
      mine: No perfil
      here: Neste aparelho
      dark: escuro
      use_profile: Usar no perfil
      use_device: Neste aparelho
      use_profile_x: "Usar %{name} no meu perfil"
      use_device_x: "Usar %{name} neste aparelho"
      follow_profile: Perfil segue o painel
      follow_device: Aparelho segue o perfil
    sidebar:
      title: Barra lateral
      pitch: A ordem e o que aparece no menu são só seus. Arraste pela alça para mudar a ordem; Configurações fica sempre.
      reset: Restaurar o padrão
      hidden: escondido
      show_x: "Mostrar %{name}"
      hide_x: "Esconder %{name}"
      fixed: sempre no fim
en:
  appearance:
    nav: Appearance
    subtitle: Each person's theme, density and the sidebar
    saved: Appearance saved.
    too_many: "The house already has %{max} themes."
    unknown: Theme does not exist.
    wallpapers:
      glow: Glow
      mesh: Mesh
      solid: Solid color
      none: No wallpaper
    fonts:
      manrope: Manrope (default)
      system: System
      rounded: Rounded
      serif: Serif
      mono: Monospace
    density:
      title: Density
      pitch: "Size of buttons, fields and spacing. Compact fits more on dashboards and desktops; comfortable makes targets bigger (the wall tablet, for example). Applies to this device, like light/dark."
    theme:
      title: My theme
      pitch: "The chosen theme applies in full on every screen (colors, background, glass and dark), over each dashboard's design. In the profile it follows you to every device; on this device, only here (the wall tablet, for example). To get each dashboard's photos and backgrounds back, use \"Profile follows the dashboard\"."
      mine: In profile
      here: On this device
      dark: dark
      use_profile: Use in profile
      use_device: On this device
      use_profile_x: "Use %{name} in my profile"
      use_device_x: "Use %{name} on this device"
      follow_profile: Profile follows the dashboard
      follow_device: Device follows the profile
    sidebar:
      title: Sidebar
      pitch: The order and what shows in the menu are yours only. Drag by the handle to reorder; Settings always stays.
      reset: Restore the default
      hidden: hidden
      show_x: "Show %{name}"
      hide_x: "Hide %{name}"
      fixed: always last
es:
  appearance:
    nav: Apariencia
    subtitle: El tema de cada persona, la densidad y la barra lateral
    saved: Apariencia guardada.
    too_many: "La casa ya tiene %{max} temas."
    unknown: El tema no existe.
    wallpapers:
      glow: Brillos
      mesh: Malla
      solid: Color liso
      none: Sin fondo
    fonts:
      manrope: Manrope (predeterminada)
      system: Del sistema
      rounded: Redondeada
      serif: Con serifa
      mono: Monoespaciada
    density:
      title: Densidad
      pitch: "Tamaño de botones, campos y espacios. Compacta cabe más en el panel y en la computadora; cómoda agranda los objetivos (la tablet de la pared, por ejemplo). Vale en este dispositivo, como claro/oscuro."
    theme:
      title: Mi tema
      pitch: "El tema elegido vale por completo en todas las pantallas (colores, fondo, vidrio y oscuro), por encima del diseño de cada panel. En el perfil te sigue a todo aparato; en este aparato, solo aquí (la tablet de la pared, por ejemplo). Para volver a las fotos y fondos de cada panel, usa \"El perfil sigue al panel\"."
      mine: En el perfil
      here: En este aparato
      dark: oscuro
      use_profile: Usar en el perfil
      use_device: En este aparato
      use_profile_x: "Usar %{name} en mi perfil"
      use_device_x: "Usar %{name} en este aparato"
      follow_profile: El perfil sigue al panel
      follow_device: El aparato sigue al perfil
    sidebar:
      title: Barra lateral
      pitch: El orden y lo que aparece en el menú son solo tuyos. Arrastra por el asa para cambiar el orden; Configuración queda siempre.
      reset: Restaurar lo predeterminado
      hidden: oculto
      show_x: "Mostrar %{name}"
      hide_x: "Ocultar %{name}"
      fixed: siempre al final
