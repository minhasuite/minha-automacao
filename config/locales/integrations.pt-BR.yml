        'off': Este servidor não tem broker MQTT (só o servidor da casa tem).
        'on': Broker configurado neste servidor.
      network_tracker:
        away: Fora depois de
        help: 'Só lê: um teste por endereço a cada minuto. Cada endereço vira um aparelho com o ponto "Conectado", que serve de fonte para uma Pessoa (Helpers → Pessoa). Celular dorme e some da rede: por isso "fora" só depois do tempo acima sem resposta. Dê IP fixo ao celular no roteador.'
        hosts: 'Endereços (um por linha: Nome = IP ou nome na rede)'
        hosts_hint: Celular da Ana = 192.168.0.23
        method: Como testar
        name_hint: Rastreador de rede
        port: Porta (TCP)
      reolink:
        note: Câmera ou NVR (um aparelho por canal). Porta 443 usa HTTPS. A detecção de pessoa, veículo e animal é a do próprio aparelho, lida a cada 5 s.
        password_hint: a do app Reolink
      shelly:
        note: Gen1 e Plus/Pro são reconhecidos sozinhos. O estado é lido a cada 30 s e logo depois de cada comando.
        password: Senha (só se a autenticação estiver ligada)
        password_hint: usuário admin
      spotify:
        help_html: Crie um app em developer.spotify.com/dashboard (Web API), cadastre a URI de retorno %{uri} e copie o Client ID e o Client Secret para cá. Eles ficam guardados cifrados.
      switchbot:
        from_app: do app SwitchBot
        help: 'No app SwitchBot: Perfil → Preferências → toque 10 vezes em "Versão do app" → Opções de desenvolvedor. O estado é lido a cada 5 min (limite da conta) e o comando vai pela nuvem da SwitchBot.'
        secret: Segredo (secret key)
      system:
        intro: 'Não há conta: o servidor vira um aparelho "Sistema" com pontos de disco, último backup, integrações com erro, automações (ligadas, execuções e falhas em 24 h) e pontos sem sinal, lidos a cada 5 min. Use nos alertas, nas automações e no painel de manutenção.'
      tasmota:
        intro: O Tasmota conversa com o broker MQTT do servidor da casa. Com a descoberta nativa ligada, cada aparelho aparece sozinho, com relés, brilho e sensores.
        step1: No aparelho, em Configuration → MQTT, informe o IP do servidor, a porta 1883 e o usuário e a senha do broker.
        step2_html: No Console do aparelho, rode <code>SetOption19 0</code> (descoberta nativa do Tasmota, a padrão desde a versão 9.2).
      telegram:
        chat: Chat (id da conversa)
        chat_hint: Use Achar meu chat
        token: Token do bot
        token_hint: No Telegram, fale com o @BotFather, mande /newbot e copie o token. Ele fica cifrado e só serve para o seu bot.
        webhook: Receber as respostas por webhook (precisa do endereço público com https)
        webhook_hint: Sem webhook, o servidor busca as respostas dos botões no Telegram sozinho (funciona sem endereço público).
      tizen:
        note: 'Na primeira leitura a TV pergunta se permite o acesso: aceite no controle em até 30 s. A 8002 é a conexão cifrada (padrão); a 8001 é a antiga.'
      tuya:
        note: 'Como no Home Assistant: os aparelhos da conta, inclusive os Zigbee do hub, entram com estado em tempo real e comando pela nuvem da Tuya. O que já está na rede local (LocalTuya) continua sendo comandado direto na rede. Conectar aqui não desconecta o Home Assistant.'
        step1_html: No celular, abra o app <strong>Smart Life</strong> (ou Tuya Smart).
        step2_html: Toque em <strong>Eu</strong> e depois na engrenagem (<strong>Configurações</strong>) no alto.
        step3_html: Entre em <strong>Conta e segurança</strong> e copie o <strong>Código de usuário</strong> (diferencia maiúsculas).
        step4: Cole aqui. Na próxima tela aparece um QR code para escanear com o próprio app.
        user_code: Código de usuário
      unifi_protect:
        note: Use um usuário local (não a conta Ubiquiti na nuvem) com acesso só de leitura ao Protect. O certificado do console não é conferido.
        username: Usuário local do console
        username_hint: crie um usuário só para o Minha Automação
      weather:
        api_key: Chave do provedor (só se ele pedir)
        help: Lê a condição, a temperatura e a previsão de 7 dias a cada 30 min (mude em Intervalo no card). Os pontos ficam num aparelho "Clima" do local.
        keep: Deixe vazio para manter a guardada
        location: Localização
        location_blank: vazio = a do local
        name_hint: Clima
        provider: Provedor
      webos:
        note: 'Na primeira leitura a TV mostra um pedido de acesso: aceite no controle em até 1 minuto. Ligar pela rede só funciona com "Ligar via Wi-Fi/LAN" ativo na TV. Porta 3001 = conexão cifrada (TVs mais novas).'
      whatsapp:
        app_secret: Segredo do app (para os botões)
        intro: 'Da sua conta no Meta for Developers (app do tipo Empresa com o produto WhatsApp): token de acesso permanente (usuário do sistema), o Phone number ID e o número que recebe os avisos.'
        language: Idioma do modelo
        template: Modelo (opcional)
        template_hint: A Meta só aceita mensagem livre até 24 h depois da sua última mensagem para o número. Com um modelo aprovado (texto com o parâmetro 1), o aviso sai sempre, mas sem foto nem botões.
        to: Número que recebe (com DDI e DDD)
        token: Token de acesso
      wled:
        note: Liga, brilho (0 a 255), cor do segmento principal e os efeitos do aparelho. O estado é lido a cada 30 s e logo depois de cada comando.
      xiaomi:
        captcha: Texto da imagem
        captcha_alt: Imagem de verificação da Xiaomi
        captcha_intro: 'A Xiaomi pediu a verificação: digite o que aparece na imagem e a senha de novo.'
        help: Login próprio, separado do Home Assistant. A conta só lista os aparelhos e o token de cada um; o controle é local. Se a Xiaomi pedir verificação em duas etapas, entre pelo QR code do app Mi Home.
        qr: Entrar com o QR code do Mi Home
        region: Servidor da conta
        username: E-mail, telefone ou ID da conta Xiaomi
      yeelight:
        note: No app Yeelight, ligue o "Controle pela LAN" da lâmpada. Uma integração por lâmpada (informe o IP).
      zigbee2mqtt:
        intro_html: O zigbee2mqtt roda no servidor da casa e conversa pelo mesmo broker MQTT. Ele fica <strong>desligado até o coordenador USB chegar</strong>; depois de ligado, cada aparelho pareado aparece sozinho, com os pontos.
        step1_html: Ligue o coordenador no servidor e instale o aplicativo Zigbee2MQTT em Configurações → Aplicativos, com o caminho do coordenador (<code>/dev/serial/by-id/…</code>).
        step2: Pareie os aparelhos pelo frontend do zigbee2mqtt (permitir entrada).
