en:
  onboarding:
    restore:
      title: "Restore from a backup"
      subtitle: "Bring everything from another installation: accounts, sites, devices, automations and dashboards."
  backup_restore:
    nav: "Backups"
    subtitle: "Backups and restore"
    title: "Restore a backup"
    pitch: "Brings the whole server back to the chosen backup. The current database is saved first; if the backup doesn't come up, it goes back on its own."
    no_supervisor: "Restoring needs the supervisor, which only runs on the local server."
    choose: "Backup"
    none: "No backups yet. Upload a file below."
    here: "On this server"
    away: "Off-site copy"
    upload: "Upload a backup file"
    file: "File (.sql.gz or .enc)"
    passphrase: "Backup password (.enc only)"
    upload_hint: "Use the daily backup (.sql.gz) or the encrypted copy (.enc) with the backup password."
    warning: "Everything changed after this backup is lost. Automations stop for a few minutes."
    word: "RESTORE"
    type_word: "Type %{word} to confirm"
    confirm_wrong: "Type the confirmation word to restore."
    submit: "Restore"
    started: "Restore started. The server restarts on its own; sign in again when it is back."
    fresh: "Start from scratch"
    from_backup: "Already have a backup? Restore it here"
    onboarding_wait: "The server restarts on its own. Then sign in with an account from the backup."
    states:
      running: "Restoring"
      done: "Backup restored"
      rolled_back: "Restore undone"
      failed: "Restore failed"
    badges:
      running: "In progress"
      done: "Done"
      rolled_back: "Undone"
      failed: "Failed"
    steps:
      check: "checking the file"
      backup: "saving the current database"
      restore: "restoring"
      rollback: "bringing back the previous database"
    errors:
      too_big: "File larger than %{mb} MB."
      bad_name: "Invalid backup."
      need_pass: "This file is encrypted: enter the backup password."
      bad_pass: "Wrong backup password or corrupted file."
      not_dump: "The file is not a Minha Automação backup (.sql.gz)."
      running: "A restore is already running."
      no_file: "Choose the backup file."
es:
  onboarding:
    restore:
      title: "Restaurar desde una copia"
      subtitle: "Traiga todo de otra instalación: cuentas, sitios, dispositivos, automatizaciones y paneles."
  backup_restore:
    nav: "Copias"
    subtitle: "Copias de seguridad y restauración"
    title: "Restaurar una copia"
    pitch: "Vuelve el servidor entero a la copia elegida. Antes se guarda la base actual; si la copia no levanta, vuelve sola."
    no_supervisor: "Restaurar necesita el supervisor, que solo corre en el servidor local."
    choose: "Copia"
    none: "Todavía no hay copias. Envíe un archivo abajo."
    here: "En este servidor"
    away: "Copia fuera de casa"
    upload: "Enviar un archivo de copia"
    file: "Archivo (.sql.gz o .enc)"
    passphrase: "Contraseña de la copia (solo .enc)"
    upload_hint: "Use la copia diaria (.sql.gz) o la copia cifrada (.enc) con la contraseña de la copia."
    warning: "Todo lo que cambió después de esta copia se pierde. Las automatizaciones se detienen unos minutos."
    word: "RESTAURAR"
    type_word: "Escriba %{word} para confirmar"
    confirm_wrong: "Escriba la palabra de confirmación para restaurar."
    submit: "Restaurar"
    started: "La restauración empezó. El servidor se reinicia solo; entre de nuevo cuando vuelva."
    fresh: "Empezar de cero"
    from_backup: "¿Ya tiene una copia? Restáurela aquí"
    onboarding_wait: "El servidor se reinicia solo. Después, entre con una cuenta de la copia."
    states:
      running: "Restaurando"
      done: "Copia restaurada"
      rolled_back: "Restauración deshecha"
      failed: "La restauración falló"
    badges:
      running: "En curso"
      done: "Concluida"
      rolled_back: "Deshecha"
      failed: "Falló"
    steps:
      check: "revisando el archivo"
      backup: "guardando la base actual"
      restore: "restaurando"
      rollback: "volviendo la base de antes"
    errors:
      too_big: "Archivo mayor que %{mb} MB."
      bad_name: "Copia no válida."
      need_pass: "Este archivo está cifrado: indique la contraseña de la copia."
      bad_pass: "Contraseña de la copia errónea o archivo dañado."
      not_dump: "El archivo no es una copia de Minha Automação (.sql.gz)."
      running: "Ya hay una restauración en curso."
      no_file: "Elija el archivo de copia."
