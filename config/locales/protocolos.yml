# ondaC1: protocolos e ecossistemas (Z-Wave, Bluetooth, Matter, Thread, HomeKit, Google Home).
pt-BR:
  protocols:
    panel:
      open: "Gerenciar"
      title: "Gerenciar %{name}"
      unreachable: "Não deu para falar com o serviço agora."
    ble:
      bindkeys: "Chaves dos sensores cifrados (opcional)"
      bindkeys_hint: "AA:BB:CC:DD:EE:FF=chave de 32 caracteres; uma por aparelho, separadas por ;"
      note_html: "Liga o serviço <code>ble-scanner</code> (perfil <code>bluetooth</code> do compose) com a chave gerada em <strong>Gerenciar</strong>. Escuta passiva: o servidor só ouve, não conecta nem pareia. BTHome cifrado e Xiaomi novos precisam da chave (bindkey)."
    zwave:
      summary: "Resumo da rede Z-Wave"
      controller: "Controlador"
      sdk: "SDK %{v}"
      nodes: "Nós"
      node_counts: "%{alive} no ar · %{asleep} dormindo · %{dead} sem resposta"
      security: "Com segurança"
      secure_hint: "S2 ou S0 (comunicação cifrada)"
      server: "Servidor Z-Wave JS"
      driver: "driver %{v}"
      inclusion: "Adicionar e tirar aparelhos"
      inclusion_pitch: "A inclusão usa S2 sempre que o aparelho tiver: você confere o código da etiqueta e a comunicação sai cifrada. Com SmartStart basta ler o QR uma vez e ligar o aparelho."
      strategy: "Segurança"
      strategies:
        default: "Recomendada"
        s2: "Só S2"
        insecure: "Sem segurança"
      strategies_hint:
        default: "S2 se o aparelho tiver; senão S0. É o que o Home Assistant faz."
        s2: "Recusa aparelhos sem S2. Para fechaduras e portões."
        insecure: "Para aparelhos antigos que falham com segurança. Evite em fechaduras."
      include: "Incluir aparelho"
      exclude: "Excluir aparelho"
      exclude_confirm: "Ligar a exclusão? O próximo aparelho que apertar o botão sai da rede."
      rebuild: "Refazer rotas"
      stop: "Parar"
      waiting_include: "Esperando o aparelho… coloque-o em modo de pareamento."
      waiting_exclude: "Esperando o aparelho… aperte o botão de pareamento dele."
      grant_title: "O aparelho pediu estes níveis de segurança. Conceda os que fazem sentido:"
      grant: "Conceder"
      classes:
        s2_access_control: "S2 controle de acesso"
        s2_authenticated: "S2 autenticado"
        s2_unauthenticated: "S2 não autenticado"
        s0_legacy: "S0 (antigo)"
        unknown: "Desconhecido"
      classes_hint:
        s2_access_control: "Fechaduras e portões. O mais forte."
        s2_authenticated: "Aparelhos com teclado ou tela. Pede o PIN."
        s2_unauthenticated: "Cifrado, sem conferir o código."
        s0_legacy: "Cifra antiga e lenta; use só se não houver S2."
        unknown: ""
      dsk_title: "Confira o código (DSK) na etiqueta ou na caixa do aparelho e digite os 5 primeiros dígitos:"
      dsk: "Código DSK do aparelho"
      pin: "PIN (5 dígitos)"
      pin_hint: "Os 5 primeiros números do DSK, sublinhados na etiqueta. Só o aparelho certo tem esse código."
      send_pin: "Confirmar"
      added: "Nó %{node} entrou na rede. Entrevistando…"
      low_security: "Entrou com segurança menor que a pedida. Para fechaduras, exclua e inclua de novo perto do controlador."
      see_found: "Ver e adicionar"
      dismiss: "Fechar"
      states:
        requested: "Pedido"
        running: "Em andamento"
        stop: "Parando"
        grant: "Escolha a segurança"
        granted: "Concedido"
        dsk: "Confira o código"
        pin: "PIN enviado"
        added: "Entrevistando"
        done: "Pronto: o aparelho novo já aparece em Encontrados."
        removed: "Aparelho tirado da rede."
        stopped: "Parou sem nenhum aparelho."
        failed: "Não deu certo."
      smart_start: "SmartStart (QR do aparelho)"
      smart_start_hint: "Leia o QR da etiqueta com o celular e cole os números aqui. O aparelho entra com S2 quando for ligado, sem apertar nada."
      provision: "Adicionar à lista"
      smart_start_list: "Aguardando pelo SmartStart"
      unprovision: "Tirar"
      map: "Mapa da rede"
      map_hint: "Quem alcança quem pelo rádio. Nó sem linha está longe: um aparelho na tomada entre os dois ajuda."
      node_list: "Aparelhos"
      no_nodes: "Nenhum aparelho além do controlador."
      node_n: "Nó %{n}"
      col_node: "Aparelho"
      col_status: "Situação"
      col_security: "Segurança"
      col_actions: "Ações"
      insecure: "Sem segurança"
      reinterview: "Reentrevistar"
      remove_failed: "Remover nó com falha"
      remove_failed_confirm: "Remover o nó %{n} da rede? Use só se o aparelho quebrou ou sumiu."
      status:
        alive: "No ar"
        awake: "Acordado"
        asleep: "Dormindo"
        dead: "Sem resposta"
        unknown: "Desconhecido"
en:
  protocols:
    panel:
      open: "Manage"
      title: "Manage %{name}"
      unreachable: "Couldn't reach the service right now."
    ble:
      bindkeys: "Keys of encrypted sensors (optional)"
      bindkeys_hint: "AA:BB:CC:DD:EE:FF=32-character key; one per device, separated by ;"
      note_html: "Start the <code>ble-scanner</code> service (compose profile <code>bluetooth</code>) with the key generated in <strong>Manage</strong>. Passive listening: the server only listens, it never connects or pairs. Encrypted BTHome and newer Xiaomi need the key (bindkey)."
    zwave:
      summary: "Z-Wave network summary"
      controller: "Controller"
      sdk: "SDK %{v}"
      nodes: "Nodes"
      node_counts: "%{alive} online · %{asleep} asleep · %{dead} not responding"
      security: "Secure"
      secure_hint: "S2 or S0 (encrypted)"
      server: "Z-Wave JS server"
      driver: "driver %{v}"
      inclusion: "Add and remove devices"
      inclusion_pitch: "Inclusion uses S2 whenever the device supports it: you check the code on the label and traffic is encrypted. With SmartStart you scan the QR once and power the device up."
      strategy: "Security"
      strategies:
        default: "Recommended"
        s2: "S2 only"
        insecure: "No security"
      strategies_hint:
        default: "S2 if the device has it; otherwise S0. Same as Home Assistant."
        s2: "Refuses devices without S2. For locks and gates."
        insecure: "For old devices that fail with security. Avoid on locks."
      include: "Add device"
      exclude: "Remove device"
      exclude_confirm: "Turn on exclusion? The next device that presses its button leaves the network."
      rebuild: "Rebuild routes"
      stop: "Stop"
      waiting_include: "Waiting for the device… put it in pairing mode."
      waiting_exclude: "Waiting for the device… press its pairing button."
      grant_title: "The device asked for these security levels. Grant the ones that make sense:"
      grant: "Grant"
      classes:
        s2_access_control: "S2 access control"
        s2_authenticated: "S2 authenticated"
        s2_unauthenticated: "S2 unauthenticated"
        s0_legacy: "S0 (legacy)"
        unknown: "Unknown"
      classes_hint:
        s2_access_control: "Locks and gates. The strongest."
        s2_authenticated: "Devices with a keypad or screen. Asks for the PIN."
        s2_unauthenticated: "Encrypted, without checking the code."
        s0_legacy: "Old, slow encryption; only if there's no S2."
        unknown: ""
      dsk_title: "Check the code (DSK) on the device label or box and type its first 5 digits:"
      dsk: "Device DSK code"
      pin: "PIN (5 digits)"
      pin_hint: "The first 5 numbers of the DSK, underlined on the label. Only the right device has this code."
      send_pin: "Confirm"
      added: "Node %{node} joined the network. Interviewing…"
      low_security: "It joined with less security than requested. For locks, remove it and add it again close to the controller."
      see_found: "See and add"
      dismiss: "Close"
      states:
        requested: "Requested"
        running: "In progress"
        stop: "Stopping"
        grant: "Choose the security"
        granted: "Granted"
        dsk: "Check the code"
        pin: "PIN sent"
        added: "Interviewing"
        done: "Done: the new device already shows up in Found."
        removed: "Device removed from the network."
        stopped: "Stopped without any device."
        failed: "It didn't work."
      smart_start: "SmartStart (device QR)"
      smart_start_hint: "Scan the QR on the label with your phone and paste the numbers here. The device joins with S2 when powered, no button needed."
      provision: "Add to the list"
      smart_start_list: "Waiting through SmartStart"
      unprovision: "Remove"
      map: "Network map"
      map_hint: "Who reaches whom over the radio. A node with no line is far away: a mains-powered device between them helps."
      node_list: "Devices"
      no_nodes: "No devices besides the controller."
      node_n: "Node %{n}"
      col_node: "Device"
      col_status: "Status"
      col_security: "Security"
      col_actions: "Actions"
      insecure: "No security"
      reinterview: "Re-interview"
      remove_failed: "Remove failed node"
      remove_failed_confirm: "Remove node %{n} from the network? Only if the device broke or is gone."
      status:
        alive: "Online"
        awake: "Awake"
        asleep: "Asleep"
        dead: "Not responding"
        unknown: "Unknown"
