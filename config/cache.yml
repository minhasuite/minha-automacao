default: &default
  store_options:
    # Cap age of oldest cache entry to fulfill retention policies
    # max_age: <%= 60.days.to_i %>
    max_size: <%= 256.megabytes %>
    namespace: <%= Rails.env %>

development:
  <<: *default

test:
  <<: *default

# 18/11/2026: o cache é quase só painel resolvido (chave por carimbo do local e minuto, ~19 kB cada) e a entrada
# vencida só sai quando bate no teto: com 256 MB eram ~20 mil painéis velhos (80% do banco da casa).
production:
  <<: *default
  store_options:
    max_age: <%= 1.day.to_i %>
    max_size: <%= 32.megabytes %>
    namespace: <%= Rails.env %>
