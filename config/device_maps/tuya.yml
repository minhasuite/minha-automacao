# Códigos padrão da Tuya (dp code) que viram ponto, para a varredura da
# conta Smart Life (Tuya::Cloud.points). Além de nome/unidade/capacidade,
# `risk` vai para o ponto e `decode`/`field`/`match`/`hold_s`/`push_only` vão
# para o endereço (Points::Decode, PointHoldJob). Interruptor (switch_N), lâmpada
# (switch_led + bright_value) e medição da tomada (cur_*) passam pela mesma
# tradução da importação do LocalTuya; o resto segue o tipo do dp com os
# nomes, unidades e capacidades daqui. Código novo = linha nova aqui.
# Família de códigos numerados (switch_mode1, switch_mode2…) vai em
# `patterns` (regex; %{1} no nome = o número). `read_only` tira o comando de
# um dp que a Tuya marca como gravável; capacidade `event` (botão, campainha)
# dispara a cada empurrão, mesmo repetido, e só conta o que o aparelho
# empurra (`push_only`). `decode: value` + `match`/`unmatched` transforma um
# enum em verdadeiro/falso (pir → movimento).
codes:
  doorcontact_state: { name: Abertura, capability: contact, device_class: door }
  temp_current: { name: Temperatura, unit: "°C", device_class: temperature }
  va_temperature: { name: Temperatura, unit: "°C", device_class: temperature }
  humidity_value: { name: Umidade, unit: "%", device_class: humidity }
  va_humidity: { name: Umidade, unit: "%", device_class: humidity }
  battery_percentage: { name: Bateria, unit: "%", device_class: battery }
  va_battery: { name: Bateria, unit: "%", device_class: battery }
  residual_electricity: { name: Bateria, unit: "%", device_class: battery }
  temper_alarm: { name: Violação, capability: tamper, device_class: tamper }
  pir: { name: Movimento, capability: motion, device_class: motion, decode: value, match: pir, unmatched: false }
  presence_state: { name: Presença, capability: motion, device_class: occupancy, decode: value, match: presence, unmatched: false }
  # Tomada e disjuntor: energia acumulada (kWh).
  add_ele: { name: Energia, unit: kWh, device_class: energy, state_class: total_increasing }
  temp_value: { name: Temperatura de cor }
  temp_value_v2: { name: Temperatura de cor }
  # Hub Zigbee: "alarm" = problema no hub.
  master_state: { name: Hub com problema, capability: problem, device_class: problem, decode: value, match: alarm, unmatched: false }
  # Fechadura (videolock/jtmspro/ms): só estado e eventos. Destravar pela
  # nuvem de compartilhamento não existe (o HA também não tem); o estado do
  # motor nunca vira comando.
  lock_motor_state: { name: Motor da fechadura, capability: onoff, read_only: true, risk: critical }
  doorbell: { name: Campainha, capability: event, push_only: true }
  alarm_lock: { name: Alarme da fechadura, capability: event, push_only: true }
  hijack: { name: Abertura sob coação, capability: problem }
  open_inside: { name: Aberta por dentro, capability: event, push_only: true }
  unlock_fingerprint: { name: Destravou por digital, capability: event, push_only: true }
  unlock_password: { name: Destravou por senha, capability: event, push_only: true }
  unlock_card: { name: Destravou por cartão, capability: event, push_only: true }
  unlock_face: { name: Destravou por rosto, capability: event, push_only: true }
  unlock_key: { name: Destravou por chave, capability: event, push_only: true }
  unlock_temporary: { name: Destravou por senha temporária, capability: event, push_only: true }
  unlock_dynamic: { name: Destravou por senha dinâmica, capability: event, push_only: true }
  unlock_app: { name: Destravou pelo app, capability: event, push_only: true }
  unlock_phone_remote: { name: Destravou pelo celular, capability: event, push_only: true }
  unlock_voice_remote: { name: Destravou por voz, capability: event, push_only: true }
  unlock_hand: { name: Destravou pela palma, capability: event, push_only: true }
  work_mode: { name: Modo }
  mode: { name: Modo }
  temp_set: { name: Temperatura desejada }
  fan_speed_enum: { name: Velocidade }
  child_lock: { name: Trava infantil }
  switch_backlight: { name: Luz de fundo }
  # Câmera (categoria sp). A sirene é um liga/desliga comum, de risco crítico.
  siren_switch: { name: Sirene, risk: critical }
  floodlight_switch: { name: Holofote }
  motion_switch: { name: Detecção de movimento }
  basic_private: { name: Modo privacidade }
  basic_flip: { name: Imagem invertida }
  basic_osd: { name: Hora na imagem }
  basic_indicator: { name: Luz indicadora }
  basic_nightvision: { name: Visão noturna }
  nightvision_mode: { name: Visão noturna }
  basic_anti_flicker: { name: Antitremulação }
  basic_device_volume: { name: Volume }
  motion_sensitivity: { name: Sensibilidade de movimento }
  motion_tracking: { name: Seguir movimento }
  motion_record: { name: Gravar ao detectar movimento }
  motion_timer_switch: { name: Agenda da detecção }
  humanoid_filter: { name: Só pessoas }
  ipc_object_outline: { name: Contorno de objetos }
  ipc_auto_siren: { name: Sirene automática, risk: sensitive }
  ipc_sharp: { name: Nitidez }
  ipc_contrast: { name: Contraste }
  ipc_bright: { name: Brilho da imagem }
  decibel_switch: { name: Detecção de som }
  decibel_sensitivity: { name: Sensibilidade de som }
  record_switch: { name: Gravação }
  record_mode: { name: Modo de gravação }
  sd_status: { name: Cartão SD }
  pir_sensitivity: { name: Sensibilidade }
  # Movimento: o dp chega como base64 de um JSON {cmd: "ipc_motion", ...}
  # empurrado pelo aparelho; vira verdadeiro e volta a falso depois de hold_s.
  # `push_only`: o estado completo repete a última mensagem e não conta.
  initiative_message: { name: Movimento, capability: motion, device_class: motion, decode: base64_json, field: cmd, match: ipc_motion, hold_s: 30, push_only: true }
patterns:
  # Scene switch (wxkg) e botões sem fio: clique, duplo e longo viram evento.
  - { match: '\Aswitch_mode(\d+)\z', name: "Botão %{1}", capability: event, push_only: true }
  - { match: '\Aswitch(\d+)_value\z', name: "Botão %{1}", capability: event, push_only: true }
# Categorias que são hub (gateway): o sub-dispositivo com a mesma chave
# local, ou o único hub sem filhos na mesma chave, vira o "via" dele.
gateways: [wg2, wnykq, wfcon, alexa_yywg, gateway]
# Booleano só de leitura com estes nomes vira "problema".
problem: "alarm|fault|tamper"
# Configuração, temporizador e acumulado: não viram ponto.
# Calibração (_coe), formatação, reinício, PTZ e cadastro de senha também não.
skip: "^(countdown|cycle_time|random_time|switch_inching|relay_status|light_mode|overcharge_switch|flash_scene|scene_data|colour_data|music_data|control_data|switch_type|factory_reset|switch_alarm_sound|alarm_active|sd_format|ptz_|device_restart|motion_area|unlock_method|temporary_password|synch_method|remote_no|link_mode|dormant_time|online_switch|alarm_reminder|lock_record|lock_local_record|device_info|password_offline|unlock_offline|unlock_double)|_coe$"
