# Tarefas recorrentes do Solid Queue (sem cron externo). Horários em
# America/Sao_Paulo (config.time_zone).
production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  # Assinatura: renovação sem RTDN e plano das empresas.
  # ondaA2 A18: versão de firmware dos aparelhos que se atualizam pela rede.
  firmware_check:
    class: FirmwareCheckJob
    schedule: every day at 4:20am
  billing_reconcile:
    class: BillingReconcileJob
    schedule: every hour at minute 40
  # Reenvio diário à central de licenças (o informe que falhou na rede não volta sozinho).
  licencas_enviar_tudo:
    class: LicencasEnviarTudoJob
    schedule: every day at 4am America/Sao_Paulo
  # Device token parado há 60 dias não recebe push de ninguém.
  prune_device_tokens:
    class: PruneDeviceTokensJob
    schedule: every sunday at 4am America/Sao_Paulo
  # Histórico (F2): rollups de hora e dia; partição do mês seguinte e retenção.
  rollup_readings:
    class: RollupReadingsJob
    schedule: every hour at minute 5
  # Automação (F4): agendas vencidas.
  run_schedules:
    class: RunSchedulesJob
    schedule: every minute
  # Câmeras (F8): streams do go2rtc.
  go2rtc_sync:
    class: Go2rtcSyncJob
    schedule: every minute
  # ondaC2 (C10): retenção das gravações das câmeras.
  recordings_purge:
    class: RecordingsPurgeJob
    schedule: every hour at minute 25
  readings_maintenance:
    class: ReadingsMaintenanceJob
    schedule: every day at 3am America/Sao_Paulo
  # G20: cópia cifrada fora de casa (só com BACKUP_OFFSITE_URL; manda o dump novo, se houver) e o teste de restauração.
  backup_offsite:
    class: BackupOffsiteJob
    schedule: every hour at minute 20
  backup_restore_test:
    class: BackupOffsiteJob
    args: ["restore"]
    schedule: every sunday at 5am America/Sao_Paulo
  # Saúde do sistema: avisa os administradores do que está com erro (um aviso por problema por dia).
  health_check:
    class: HealthCheckJob
    schedule: every 10 minutes

development: {}
